<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 생활지도 관리 시스템</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px 0;
            overflow-y: auto;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #666;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9f9f9;
            color: #333;
        }

        .nav-item.active {
            background: #f0f7ff;
            border-left-color: #378ADD;
            color: #378ADD;
            font-weight: 600;
        }

        .main {
            padding: 32px;
            overflow-y: auto;
        }

        .header-date {
            display: inline-block;
            background: #378ADD;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 { font-size: 28px; margin-bottom: 24px; font-weight: 600; }
        h2 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }
        h3 { font-size: 16px; margin-bottom: 12px; font-weight: 600; }
        h4 { font-size: 14px; margin-bottom: 12px; font-weight: 600; margin-top: 16px; }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #378ADD;
            color: white;
            transition: all 0.2s;
        }

        button:hover { background: #2563c4; }
        button.secondary { background: #f0f0f0; color: #333; }
        button.secondary:hover { background: #e0e0e0; }
        button.success { background: #10b981; }
        button.success:hover { background: #059669; }

        .reason-btn {
            border: 3px solid transparent !important;
            padding: 8px 12px !important;
            transition: all 0.2s !important;
            font-weight: 600;
            font-size: 13px !important;
            width: 100%;
        }

        .reason-btn.selected {
            border: 3px solid currentColor !important;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.1), inset 0 0 8px currentColor !important;
        }

        .button-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }

        .page { display: none; }
        .page.active { display: block; }

        .sync-status {
            padding: 12px;
            background: #eff6ff;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 12px;
            color: #1e40af;
        }

        .sync-status.success {
            background: #dcfce7;
            border-color: #10b981;
            color: #166534;
        }

        .sync-status.error {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .history-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            border-left: 4px solid #3b82f6;
            margin-bottom: 8px;
        }

        .history-item .date { font-weight: 600; color: #378ADD; }
        .history-item .reason { color: #666; margin: 4px 0; }
        .history-item .status { font-size: 12px; color: #999; }

        .task-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info {
            flex: 1;
        }

        .task-info .student { font-weight: 600; }
        .task-info .detail { font-size: 12px; color: #999; margin-top: 4px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .modal button {
            padding: 12px 16px !important;
            font-size: 14px !important;
        }

        .modal .button-group {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .hamburger { display: block; }
            .sidebar {
                position: fixed;
                left: -200px;
                top: 0; bottom: 0;
                width: 200px;
                z-index: 999;
                transition: left 0.3s;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }
            .sidebar.active { left: 0; }
            .main { padding: 12px; }
            .form-row { grid-template-columns: 1fr; gap: 6px; }
            .button-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()">☰</button>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="nav-item active" onclick="switchPage('home')">🏠 홈</div>
            <div class="nav-item" onclick="switchPage('review')">✅ 미완료 과제</div>
            <div class="nav-item" onclick="switchPage('settings')">🔧 설정</div>
        </div>

        <div class="main">
            <!-- 홈 페이지 -->
            <div id="home" class="page active">
                <div class="header-date" id="todayDate"></div>
                <h1>📋 생활지도 관리</h1>

                <!-- 학생 조회 -->
                <div class="card">
                    <h2>📌 학생 조회</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학년</label>
                            <select id="inputGrade" onchange="updateClassDropdown()">
                                <option value="">선택</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>반</label>
                            <select id="inputClass">
                                <option value="">선택</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="inputName" placeholder="이름 입력" list="studentNameList" onchange="selectStudent(this.value)">
                        <datalist id="studentNameList"></datalist>
                        <input type="hidden" id="inputNumber">
                    </div>

                    <button onclick="queryRecords()" style="width: 100%;">🔍 조회</button>
                </div>

                <!-- 조회 결과 -->
                <div id="queryResultContainer"></div>
            </div>

            <!-- 미완료 과제 페이지 -->
            <div id="review" class="page">
                <div class="header-date" id="reviewDate"></div>
                <h1>✅ 미완료 과제</h1>
                
                <div class="card">
                    <h2>미완료 과제 확인</h2>
                    <p style="color: #666; margin-bottom: 16px; font-size: 13px;">
                        지정되었지만 아직 완료하지 않은 학생들을 확인하세요.
                    </p>
                    <button onclick="loadUncompletedTasks()" style="width: 100%;">📥 미완료 과제 로드</button>
                </div>

                <div id="uncompletedContainer"></div>
            </div>

            <!-- 설정 페이지 -->
            <div id="settings" class="page">
                <div class="header-date"></div>
                <h1>🔧 설정</h1>
                
                <div class="card">
                    <h2 style="color: #3b82f6;">📡 학생명단 동기화</h2>
                    <p style="color: #666; margin-bottom: 16px; font-size: 13px;">
                        Google Sheets에서 학생명단을 동기화합니다.
                    </p>
                    <button type="button" onclick="loadStudentListFromSheets()" 
                        style="width: 100%; background: #3b82f6; color: white;">
                        🔄 학생명단 로드
                    </button>
                    <div id="syncStatus" class="sync-status" style="display: none; margin-top: 12px;"></div>
                </div>

                <div class="card">
                    <h2 style="color: #10b981;">✅ 로드된 학생명단</h2>
                    <div id="studentListPreview" style="max-height: 300px; overflow-y: auto; font-size: 12px;">
                        <p style="color: #999; text-align: center; padding: 20px;">로드 버튼을 눌러주세요</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 저장 확인 모달 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>저장 확인</h3>
            <p id="confirmMessage" style="margin-bottom: 16px; color: #666;"></p>
            <div class="button-group">
                <button class="secondary" onclick="closeConfirmModal()">취소</button>
                <button onclick="confirmSave()">저장</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        // ========== 설정 ==========
        const SHEET_ID = '1FzZaqtdiTHpULtzAJSC-sLEkRVcYJWrNc1JVEe0jDyA';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzpJp67153R8Cm_y8SfCAZtWJ-mvN5FHetBNYEpl687qwZGCoh7LlCOckPpehedCOBl/exec';

        let studentList = [];
        let homeSelectedReason = '';
        let homePendingData = null;

        // ========== 초기화 ==========
        window.addEventListener('load', () => {
            console.log('✅ 페이지 로드 완료');
            updateAllDates();
        });

        // ========== Google Sheets CSV 로드 ==========
        async function loadStudentListFromSheets() {
            try {
                console.log('📡 Google Sheets에서 CSV 로드 중...');
                const statusEl = document.getElementById('syncStatus');
                statusEl.style.display = 'block';
                statusEl.className = 'sync-status';
                statusEl.innerHTML = '⏳ 로드 중...';

                const response = await fetch(CSV_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const csv = await response.text();
                Papa.parse(csv, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const data = results.data;
                        if (data.length < 2) {
                            throw new Error('학생명단이 비어있습니다');
                        }

                        studentList = data.slice(1)
                            .filter(row => row[0] && row[1] && row[2] && row[3])
                            .map(row => ({
                                grade: parseInt(row[0]),
                                class: parseInt(row[1]),
                                number: parseInt(row[2]),
                                name: String(row[3]).trim()
                            }));

                        console.log(`✅ 학생명단 로드 완료: ${studentList.length}명`);
                        statusEl.className = 'sync-status success';
                        statusEl.innerHTML = `✅ ${studentList.length}명 로드 완료!`;
                        showStudentListPreview();
                    },
                    error: function(error) {
                        throw error;
                    }
                });

            } catch (error) {
                console.error('❌ 로드 실패:', error);
                const statusEl = document.getElementById('syncStatus');
                statusEl.style.display = 'block';
                statusEl.className = 'sync-status error';
                statusEl.innerHTML = `❌ 로드 실패: ${error.message}`;
            }
        }

        // ========== 학생 필터링 ==========
        function getStudentsByClass(grade, cls) {
            return studentList
                .filter(s => s.grade == grade && s.class == cls)
                .sort((a, b) => a.number - b.number);
        }

        function getStudentNamesByClass(grade, cls) {
            return getStudentsByClass(grade, cls).map(s => s.name);
        }

        // ========== 학반 드롭다운 업데이트 ==========
        function updateClassDropdown() {
            const grade = document.getElementById('inputGrade').value;
            const classSelect = document.getElementById('inputClass');
            classSelect.innerHTML = '<option value="">선택</option>';

            let maxClass = grade === '1' ? 11 : grade === '2' ? 12 : 11;

            for (let i = 1; i <= maxClass; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '반';
                classSelect.appendChild(opt);
            }
            
            classSelect.addEventListener('change', updateStudentNameList);
        }

        function updateStudentNameList() {
            const grade = document.getElementById('inputGrade').value;
            const cls = document.getElementById('inputClass').value;
            const datalist = document.getElementById('studentNameList');
            
            datalist.innerHTML = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputNumber').value = '';
            
            if (grade && cls) {
                const names = getStudentNamesByClass(grade, cls);
                names.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    datalist.appendChild(option);
                });
            }
        }

        function selectStudent(fullName) {
            const grade = parseInt(document.getElementById('inputGrade').value);
            const cls = parseInt(document.getElementById('inputClass').value);
            const students = getStudentsByClass(grade, cls);
            const selected = students.find(s => s.name === fullName);
            
            if (selected) {
                document.getElementById('inputNumber').value = selected.number;
            }
        }

        // ========== 조회 ==========
        function queryRecords() {
            const g = document.getElementById('inputGrade').value;
            const c = document.getElementById('inputClass').value;
            const n = document.getElementById('inputName').value;
            let num = document.getElementById('inputNumber').value;
            
            if (!g || !c || !n) {
                alert('학년, 반, 이름을 모두 입력해주세요!');
                return;
            }

            if (!num) {
                const grade = parseInt(g);
                const cls = parseInt(c);
                const students = getStudentsByClass(grade, cls);
                const selected = students.find(s => s.name === n);
                
                if (selected) {
                    num = selected.number;
                    document.getElementById('inputNumber').value = num;
                } else {
                    alert('입력하신 이름이 학생명단에 없습니다.');
                    return;
                }
            }

            const student = studentList.find(s => 
                s.grade == g && s.class == c && s.number == num && s.name === n
            );

            if (!student) {
                document.getElementById('queryResultContainer').innerHTML = `
                    <div class="card" style="background: #fee2e2; border-left: 4px solid #ef4444;">
                        <p style="color: #c41c3b; font-weight: 600;">조회된 학생이 없습니다</p>
                    </div>
                `;
                return;
            }

            // 과거 기록 로드
            loadStudentHistory(g, c, n, num);
            
            // 지도 입력 카드 추가
            let html = `
                <div class="card" style="background: #f0f9ff; border-left: 4px solid #3b82f6;">
                    <h3>${g}학년 ${c}반 ${num}번 ${n}</h3>
                    
                    <h4 style="margin-top: 24px;">지도 사유 선택</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                        <button class="reason-btn" onclick="setReason('지각')" id="btn-지각" style="background: #fef3c7; color: #92400e;">지각</button>
                        <button class="reason-btn" onclick="setReason('복장')" id="btn-복장" style="background: #fce7f3; color: #831843;">복장</button>
                        <button class="reason-btn" onclick="setReason('화장')" id="btn-화장" style="background: #f3e8ff; color: #581c87;">화장</button>
                        <button class="reason-btn" onclick="setReason('기타')" id="btn-기타" style="background: #ccfbf1; color: #134e4a;">기타</button>
                    </div>
                    <input type="text" id="inputReasonOther" placeholder="기타 사유 입력" style="width: 100%; margin-bottom: 12px; display: none;">
                    
                    <h4>조치 선택</h4>
                    <div class="button-group">
                        <button onclick="prepareRecord('${g}', '${c}', '${n}', '${num}', 'work')" style="background: #e0e7ff; color: #4338ca;">📝 빡지</button>
                        <button onclick="prepareRecord('${g}', '${c}', '${n}', '${num}', 'clean')" style="background: #cffafe; color: #0c4a6e;">✨ 청소</button>
                        <button onclick="prepareRecord('${g}', '${c}', '${n}', '${num}', 'inspection')" style="background: #dbeafe; color: #0c2d6b;">🔍 검사</button>
                    </div>
                    
                    <div style="margin-top: 12px;">
                        <button class="secondary" onclick="prepareRecord('${g}', '${c}', '${n}', '${num}', 'record')" style="width: 100%;">💾 기록만 저장</button>
                    </div>
                </div>
            `;

            document.getElementById('queryResultContainer').innerHTML = html;
        }

        // ========== 사유 선택 ==========
        function setReason(reason) {
            homeSelectedReason = reason;
            document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('btn-' + reason).classList.add('selected');
            
            const otherInput = document.getElementById('inputReasonOther');
            if (reason === '기타') {
                otherInput.style.display = 'block';
                otherInput.focus();
            } else {
                otherInput.style.display = 'none';
            }
        }

        // ========== 기록 저장 준비 ==========
        function prepareRecord(g, c, n, num, type) {
            if (!homeSelectedReason) {
                alert('지도 사유를 선택해주세요!');
                return;
            }
            
            const reason = homeSelectedReason === '기타' 
                ? document.getElementById('inputReasonOther').value 
                : homeSelectedReason;
            
            if (!reason) {
                alert('모든 항목을 입력해주세요!');
                return;
            }

            const recordData = {
                date: getTodayDate(),
                grade: parseInt(g),
                class: parseInt(c),
                number: parseInt(num),
                name: n,
                reason: reason
            };
            
            if (type === 'work') {
                recordData.assignedWork = 'Y';
                recordData.completedWork = 'N';
                recordData.assignedClean = '-';
                recordData.completedClean = '-';
                recordData.assignedInspection = '-';
                recordData.completedInspection = '-';
            } else if (type === 'clean') {
                recordData.assignedWork = '-';
                recordData.completedWork = '-';
                recordData.assignedClean = 'Y';
                recordData.completedClean = 'N';
                recordData.assignedInspection = '-';
                recordData.completedInspection = '-';
            } else if (type === 'inspection') {
                recordData.assignedWork = '-';
                recordData.completedWork = '-';
                recordData.assignedClean = '-';
                recordData.completedClean = '-';
                recordData.assignedInspection = 'Y';
                recordData.completedInspection = 'N';
            } else {
                recordData.assignedWork = '-';
                recordData.completedWork = '-';
                recordData.assignedClean = '-';
                recordData.completedClean = '-';
                recordData.assignedInspection = '-';
                recordData.completedInspection = '-';
            }

            let msg = `${n} 학생\n사유: ${reason}\n\n`;
            if (type === 'work') {
                msg += '빡지를 지정하시겠습니까?';
            } else if (type === 'clean') {
                msg += '청소를 지정하시겠습니까?';
            } else if (type === 'inspection') {
                msg += '검사를 지정하시겠습니까?';
            } else {
                msg += '기록을 저장하시겠습니까?';
            }
            
            homePendingData = recordData;
            showConfirmModal(msg);
        }

        // ========== 모달 ==========
        function showConfirmModal(msg) {
            document.getElementById('confirmMessage').textContent = msg;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            homePendingData = null;
        }

        function confirmSave() {
            if (homePendingData) {
                saveToSheets(homePendingData);
            }
            closeConfirmModal();
        }

        // ========== Apps Script에 저장 ==========
        async function saveToSheets(recordData) {
            try {
                console.log('📤 저장 중:', recordData);
                
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(recordData)
                });
                
                const result = await response.json();
                console.log('📤 응답:', result);
                
                if (!result.success) {
                    throw new Error(result.error || '저장 실패');
                }
                
                console.log(`✅ 저장 완료`);
                alert('✅ 저장되었습니다!');
                
                // 입력 초기화
                document.getElementById('inputGrade').value = '';
                document.getElementById('inputClass').value = '';
                document.getElementById('inputClass').innerHTML = '<option value="">선택</option>';
                document.getElementById('inputNumber').value = '';
                document.getElementById('inputName').value = '';
                document.getElementById('queryResultContainer').innerHTML = '';
                homeSelectedReason = '';
                
            } catch (error) {
                console.error('❌ 저장 실패:', error);
                alert('❌ 저장 실패: ' + error.message);
            }
        }

        // ========== 과거 기록 로드 ==========
        async function loadStudentHistory(grade, cls, name, num) {
            try {
                const url = `${APPS_SCRIPT_URL}?action=getRecords&grade=${grade}&class=${cls}&name=${encodeURIComponent(name)}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    displayHistory(result.data);
                }
            } catch (error) {
                console.error('❌ 과거기록 로드 실패:', error);
            }
        }

        function displayHistory(records) {
            let html = `
                <div class="card">
                    <h4>📋 지도내역 (${records.length}건)</h4>
            `;
            
            records.forEach(record => {
                let status = '';
                if (record.completedWork === 'Y') status += ' ✅빡지완료';
                if (record.completedClean === 'Y') status += ' ✅청소완료';
                if (record.completedInspection === 'Y') status += ' ✅검사완료';
                
                if (record.completedWork === 'N' && record.assignedWork === 'Y') status += ' ⏳빡지미완';
                if (record.completedClean === 'N' && record.assignedClean === 'Y') status += ' ⏳청소미완';
                if (record.completedInspection === 'N' && record.assignedInspection === 'Y') status += ' ⏳검사미완';
                
                html += `
                    <div class="history-item">
                        <div class="date">${record.date}</div>
                        <div class="reason">${record.reason}</div>
                        <div class="status">${status}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('queryResultContainer').innerHTML = html + document.getElementById('queryResultContainer').innerHTML;
        }

        // ========== 미완료 과제 로드 ==========
        async function loadUncompletedTasks() {
            try {
                console.log('📥 미완료 과제 로드 중...');
                
                const url = `${APPS_SCRIPT_URL}?action=getUncompletedTasks`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error);
                }
                
                displayUncompletedTasks(result.data);
                
            } catch (error) {
                console.error('❌ 로드 실패:', error);
                document.getElementById('uncompletedContainer').innerHTML = 
                    `<div class="card" style="background: #fee2e2;"><p style="color: #991b1b;">❌ 로드 실패: ${error.message}</p></div>`;
            }
        }

        function displayUncompletedTasks(tasks) {
            let html = '';
            
            const workTasks = tasks.filter(t => t.assignedWork === 'Y' && t.completedWork !== 'Y');
            if (workTasks.length > 0) {
                html += `
                    <div class="card" style="border-left: 4px solid #e0e7ff;">
                        <h3 style="color: #4338ca;">📝 빡지 미완료 (${workTasks.length}명)</h3>
                        ${workTasks.map(t => `
                            <div class="task-item">
                                <div class="task-info">
                                    <div class="student">${t.grade}학년 ${t.class}반 ${t.number}번 ${t.name} (${t.reason})</div>
                                    <div class="detail">${t.date}</div>
                                </div>
                                <button class="success" onclick="markCompleted(${t.grade}, ${t.class}, ${t.number}, '${t.name}', 'work')" style="width: auto;">✅ 완료</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            const cleanTasks = tasks.filter(t => t.assignedClean === 'Y' && t.completedClean !== 'Y');
            if (cleanTasks.length > 0) {
                html += `
                    <div class="card" style="border-left: 4px solid #cffafe;">
                        <h3 style="color: #0c4a6e;">✨ 청소 미완료 (${cleanTasks.length}명)</h3>
                        ${cleanTasks.map(t => `
                            <div class="task-item">
                                <div class="task-info">
                                    <div class="student">${t.grade}학년 ${t.class}반 ${t.number}번 ${t.name} (${t.reason})</div>
                                    <div class="detail">${t.date}</div>
                                </div>
                                <button class="success" onclick="markCompleted(${t.grade}, ${t.class}, ${t.number}, '${t.name}', 'clean')" style="width: auto;">✅ 완료</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            const inspectionTasks = tasks.filter(t => t.assignedInspection === 'Y' && t.completedInspection !== 'Y');
            if (inspectionTasks.length > 0) {
                html += `
                    <div class="card" style="border-left: 4px solid #dbeafe;">
                        <h3 style="color: #0c2d6b;">🔍 검사 미완료 (${inspectionTasks.length}명)</h3>
                        ${inspectionTasks.map(t => `
                            <div class="task-item">
                                <div class="task-info">
                                    <div class="student">${t.grade}학년 ${t.class}반 ${t.number}번 ${t.name} (${t.reason})</div>
                                    <div class="detail">${t.date}</div>
                                </div>
                                <button class="success" onclick="markCompleted(${t.grade}, ${t.class}, ${t.number}, '${t.name}', 'inspection')" style="width: auto;">✅ 완료</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            if (html === '') {
                html = '<div class="card" style="background: #dcfce7;"><p style="color: #166534; text-align: center; padding: 20px;">✅ 미완료 과제가 없습니다!</p></div>';
            }
            
            document.getElementById('uncompletedContainer').innerHTML = html;
        }

        // ========== 완료 표시 ==========
        async function markCompleted(grade, cls, number, name, type) {
            try {
                const updateData = {
                    grade: grade,
                    class: cls,
                    number: number,
                    name: name,
                    type: type
                };
                
                console.log('📤 완료 표시:', updateData);
                
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    console.log('✅ 완료 표시 완료');
                    alert('✅ 완료 표시되었습니다!');
                    loadUncompletedTasks(); // 다시 로드
                }
            } catch (error) {
                console.error('❌ 실패:', error);
                alert('❌ 실패: ' + error.message);
            }
        }

        // ========== 페이지 전환 ==========
        function switchPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('sidebar').classList.remove('active');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // ========== 날짜 ==========
        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function updateAllDates() {
            const d = new Date();
            const days = ['(일)', '(월)', '(화)', '(수)', '(목)', '(금)', '(토)'];
            const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}`;
            document.querySelectorAll('[id$="Date"]').forEach(el => el.textContent = dateStr);
        }

        // ========== 명단 미리보기 ==========
        function showStudentListPreview() {
            const preview = document.getElementById('studentListPreview');
            
            if (studentList.length === 0) {
                preview.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">명단이 없습니다.</p>';
                return;
            }
            
            let html = `<table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                <tr style="background: #f0f0f0; font-weight: 600;">
                    <td style="padding: 6px; border: 1px solid #ddd; width: 40px;">학년</td>
                    <td style="padding: 6px; border: 1px solid #ddd; width: 40px;">반</td>
                    <td style="padding: 6px; border: 1px solid #ddd; width: 40px;">번호</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">이름</td>
                </tr>`;
            
            studentList.slice(0, 50).forEach(student => {
                html += `<tr>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${student.grade}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${student.class}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${student.number}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${student.name}</td>
                </tr>`;
            });
            
            if (studentList.length > 50) {
                html += `<tr style="background: #f9f9f9;"><td colspan="4" style="padding: 8px; text-align: center; color: #999; font-size: 11px;">... 외 ${studentList.length - 50}명</td></tr>`;
            }
            
            html += '</table>';
            preview.innerHTML = html;
        }
    </script>
</body>
</html>
