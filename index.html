<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 생활지도 관리 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #666;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9f9f9;
            color: #333;
        }

        .nav-item.active {
            background: #f0f7ff;
            border-left-color: #378ADD;
            color: #378ADD;
            font-weight: 600;
        }

        .nav-section {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-top: 16px;
        }

        .main {
            padding: 32px;
            overflow-y: auto;
        }

        .header-date {
            display: inline-block;
            background: #378ADD;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 2fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #378ADD;
            box-shadow: 0 0 0 2px rgba(55, 138, 221, 0.1);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            background: #378ADD;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .options {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }

        .option-btn {
            flex: 0 1 200px;
            padding: 12px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #378ADD;
            background: #f0f7ff;
        }

        .today-box {
            background: #e6f1fb;
            border-left: 4px solid #378ADD;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .today-box h3 {
            font-size: 13px;
            font-weight: 700;
            color: #0c447c;
            margin-bottom: 8px;
        }

        .today-item {
            background: white;
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
            font-size: 13px;
        }

        .preview-section {
            background: #f0f7ff;
            border: 1px solid #b5d4f4;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
        }

        .preview-section h3 {
            font-size: 14px;
            font-weight: 700;
            color: #0c447c;
            margin-bottom: 12px;
        }

        .preview-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 13px;
            border-left: 3px solid #378ADD;
        }

        .preview-item-main {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .preview-item-sub {
            font-size: 12px;
            color: #666;
        }

        .preview-item:last-child {
            margin-bottom: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }

        .stat-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: #378ADD;
            background: #f0f7ff;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #378ADD;
        }

        .detail-list {
            background: #f9f9f9;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
        }

        .detail-item {
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .student-item {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .student-item:hover {
            border-color: #378ADD;
            background: #f0f7ff;
        }

        .student-info h4 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }

        .student-info p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #666;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            background: #378ADD;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-small:hover {
            opacity: 0.9;
        }

        .empty {
            text-align: center;
            padding: 32px;
            color: #999;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
        }

        .modal-buttons button {
            flex: 1;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="nav-item active" onclick="switchPage('home')">🏠 홈</div>
            <div class="nav-item" onclick="switchPage('byclass')">👥 학반별관리</div>
            <div class="nav-section">학생부 지도</div>
            <div class="nav-item" onclick="switchPage('work')">💪 빡지관리</div>
            <div class="nav-item" onclick="switchPage('clean')">🧹 청소관리</div>
            <div class="nav-item" onclick="switchPage('morning')">🌅 아침확인</div>
        </div>

        <div class="main">
            <!-- 홈 -->
            <div id="home" class="page active">
                <div class="header-date" id="todayDate"></div>
                <h1>📋 등교지도 확인</h1>
                <div id="alertContainer"></div>
                <div id="todayBox"></div>
                
                <div class="card">
                    <h2>생활지도 입력</h2>
                    <div id="inputsContainer"></div>
                </div>

                <div id="previewContainer"></div>

                <div id="optionsContainer"></div>

                <div class="card" id="statsCard" style="display: none;">
                    <h2>📊 전체 누적 현황</h2>
                    <div class="stats" id="statsContainer"></div>
                    <div id="detailContainer"></div>
                </div>
            </div>

            <!-- 학반별관리 -->
            <div id="byclass" class="page">
                <div class="header-date" id="byclassDate"></div>
                <h1>👥 학반별관리</h1>
                <div id="byclassContainer"></div>
            </div>

            <!-- 빡지관리 -->
            <div id="work" class="page">
                <div class="header-date" id="workDate"></div>
                <h1>💪 빡지관리</h1>
                <div class="card">
                    <div id="workContainer"></div>
                </div>
            </div>

            <!-- 청소관리 -->
            <div id="clean" class="page">
                <div class="header-date" id="cleanDate"></div>
                <h1>🧹 청소관리</h1>
                <div class="card">
                    <div id="cleanContainer"></div>
                </div>
            </div>

            <!-- 아침확인 -->
            <div id="morning" class="page">
                <div class="header-date" id="morningDate"></div>
                <h1>🌅 아침확인</h1>
                <div class="card">
                    <h2>아침확인 입력</h2>
                    <div id="morningInputsContainer"></div>
                    <div class="button-group">
                        <button onclick="saveMorningCheck()">💾 저장</button>
                    </div>
                </div>

                <div class="card">
                    <h2>등록된 아침확인</h2>
                    <div id="morningAlertContainer"></div>
                    <div id="morningListContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 확인 모달 -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3>저장 확인</h3>
            <p id="confirmMessage"></p>
            <div class="modal-buttons">
                <button class="secondary" onclick="closeConfirmModal()">취소</button>
                <button onclick="confirmSave()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('records') || '{}');
        let morningCheck = JSON.parse(localStorage.getItem('morningCheck') || '[]');
        let workTasks = JSON.parse(localStorage.getItem('workTasks') || '[]');
        let cleanTasks = JSON.parse(localStorage.getItem('cleanTasks') || '[]');
        let inputs = [{ grade: '', class: '', name: '', reason: '' }];
        let morningInputs = [{ date: getTodayDate(), grade: '', class: '', name: '', reason: '' }];
        let selectedDetail = null;
        let previewData = null;
        let pendingSaveType = null;

        function getTodayDate() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const months = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${d.getFullYear()}년 ${months[d.getMonth()]} ${d.getDate()}일 (${days[d.getDay()]})`;
        }

        function updateAllDates() {
            const dateStr = formatDate(getTodayDate());
            document.getElementById('todayDate').textContent = dateStr;
            document.getElementById('byclassDate').textContent = dateStr;
            document.getElementById('workDate').textContent = dateStr;
            document.getElementById('cleanDate').textContent = dateStr;
            document.getElementById('morningDate').textContent = dateStr;
        }

        function save() {
            localStorage.setItem('records', JSON.stringify(records));
            localStorage.setItem('morningCheck', JSON.stringify(morningCheck));
            localStorage.setItem('workTasks', JSON.stringify(workTasks));
            localStorage.setItem('cleanTasks', JSON.stringify(cleanTasks));
        }

        function clearAllData() {
            if (confirm('정말로 모든 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다!')) {
                localStorage.removeItem('records');
                localStorage.removeItem('morningCheck');
                localStorage.removeItem('workTasks');
                localStorage.removeItem('cleanTasks');
                
                records = {};
                morningCheck = [];
                workTasks = [];
                cleanTasks = [];
                inputs = [{ grade: '', class: '', name: '', reason: '' }];
                morningInputs = [{ date: getTodayDate(), grade: '', class: '', name: '', reason: '' }];
                
                alert('모든 데이터가 삭제되었습니다!');
                location.reload();
            }
        }

        function switchPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.classList.add('active');
            
            if (name === 'home') render();
            if (name === 'byclass') renderByClass();
            if (name === 'work') renderWork();
            if (name === 'clean') renderClean();
            if (name === 'morning') renderMorning();
        }

        function renderInputs() {
            const inp = inputs[0];
            const html = `
                <div class="form-row">
                    <input type="number" placeholder="학년" min="1" max="3" value="${inp.grade}" onchange="inputs[0].grade = this.value; renderPreview()">
                    <input type="number" placeholder="반" min="1" max="20" value="${inp.class}" onchange="inputs[0].class = this.value; renderPreview()">
                    <input type="text" placeholder="이름" value="${inp.name}" onchange="inputs[0].name = this.value; renderPreview()">
                    <select onchange="inputs[0].reason = this.value; renderPreview()">
                        <option value="">사유 선택</option>
                        <option value="지각" ${inp.reason === '지각' ? 'selected' : ''}>지각</option>
                        <option value="화장" ${inp.reason === '화장' ? 'selected' : ''}>화장</option>
                        <option value="복장" ${inp.reason === '복장' ? 'selected' : ''}>복장</option>
                        <option value="기타" ${inp.reason === '기타' ? 'selected' : ''}>기타</option>
                    </select>
                </div>
            `;
            document.getElementById('inputsContainer').innerHTML = html;
        }

        function getStudentAccumulated(grade, cls, name) {
            let count = 0;
            Object.keys(records).forEach(date => {
                records[date].forEach(r => {
                    if (r.grade === grade && r.class === cls && r.name === name) {
                        count++;
                    }
                });
            });
            return count;
        }

        function renderPreview() {
            const inp = inputs[0];
            if (inp.grade && inp.class && inp.name && inp.reason) {
                previewData = [inp];
            } else {
                previewData = [];
            }

            if (!previewData || previewData.length === 0) {
                document.getElementById('previewContainer').innerHTML = '';
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('statsCard').style.display = 'none';
                return;
            }

            const html = `
                <div class="preview-section">
                    <h3>📝 지도 내용</h3>
                    ${previewData.map(p => {
                        const accumulated = getStudentAccumulated(p.grade, p.class, p.name);
                        return `
                            <div class="preview-item">
                                <div class="preview-item-main">${p.grade}학년 ${p.class}반 ${p.name} - ${p.reason}</div>
                                <div class="preview-item-sub">이 학생의 누적: ${accumulated}회</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            document.getElementById('previewContainer').innerHTML = html;

            const optionsHtml = `
                <div class="card">
                    <div class="options">
                        <div class="option-btn" onclick="showConfirmModal('work')">빡지 지정</div>
                        <div class="option-btn" onclick="showConfirmModal('clean')">청소 지정</div>
                        <div class="option-btn" onclick="showConfirmModal('none')">저장만</div>
                    </div>
                </div>
            `;
            document.getElementById('optionsContainer').innerHTML = optionsHtml;
        }

        function showConfirmModal(type) {
            pendingSaveType = type;
            const typeStr = type === 'work' ? '빡지 지정' : type === 'clean' ? '청소 지정' : '저장만';
            document.getElementById('confirmMessage').textContent = `${typeStr}으로 저장하시겠습니까?`;
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            pendingSaveType = null;
        }

        function confirmSave() {
            const type = pendingSaveType;
            const today = getTodayDate();
            previewData.forEach(p => {
                if (!records[today]) records[today] = [];
                records[today].push({...p, id: Date.now() + Math.random()});
                
                if (type === 'work') {
                    workTasks.push({
                        id: Date.now() + Math.random(),
                        studentName: p.name,
                        grade: p.grade,
                        class: p.class,
                        date: today,
                        status: '작성중'
                    });
                } else if (type === 'clean') {
                    cleanTasks.push({
                        id: Date.now() + Math.random(),
                        studentName: p.name,
                        grade: p.grade,
                        class: p.class,
                        date: today,
                        status: '작성중'
                    });
                }
            });
            inputs = [{ grade: '', class: '', name: '', reason: '' }];
            previewData = null;
            save();
            renderInputs();
            renderPreview();
            render();
            closeConfirmModal();
            alert('저장되었습니다!');
        }

        function getTodayMorningCheck() {
            return morningCheck.filter(m => m.date === getTodayDate());
        }

        function confirmMorningCheck(id) {
            const item = morningCheck.find(m => m.id == id);
            if (item) {
                item.confirmed = true;
                save();
                render();
            }
        }

        function render() {
            updateAllDates();
            renderInputs();
            
            // 미완료 빡지/청소 (모든 작성중)
            const incompleteWork = workTasks.filter(t => t.status === '작성중');
            const incompleteClean = cleanTasks.filter(t => t.status === '작성중');
            let alertHtml = '';
            
            if (incompleteWork.length > 0 || incompleteClean.length > 0) {
                alertHtml += `<div class="card" style="background-color: #ffe0e0; border-left: 4px solid #f44336; margin-bottom: 16px;">
                    <h3 style="color: #c62828; margin-top: 0;">⚠️ 미완료 과제</h3>`;
                
                if (incompleteWork.length > 0) {
                    alertHtml += `<div style="margin-bottom: 8px; font-weight: 600; color: #d32f2f;">빡지 (${incompleteWork.length}명)</div>`;
                    incompleteWork.forEach(t => {
                        alertHtml += `<div style="padding: 4px 8px; color: #d32f2f;">- ${t.date} | ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`;
                    });
                }
                
                if (incompleteClean.length > 0) {
                    alertHtml += `<div style="margin-bottom: 8px; margin-top: 8px; font-weight: 600; color: #d32f2f;">청소 (${incompleteClean.length}명)</div>`;
                    incompleteClean.forEach(t => {
                        alertHtml += `<div style="padding: 4px 8px; color: #d32f2f;">- ${t.date} | ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`;
                    });
                }
                
                alertHtml += `</div>`;
            }
            
            document.getElementById('alertContainer').innerHTML = alertHtml;

            // 오늘 확인할 학생
            const todayMorning = getTodayMorningCheck();
            if (todayMorning.length > 0) {
                document.getElementById('todayBox').innerHTML = `
                    <div class="today-box">
                        <h3>오늘 확인할 학생</h3>
                        ${todayMorning.map(t => `
                            <div class="today-item" style="display: flex; justify-content: space-between; align-items: center;">
                                <span>${t.grade}학년 ${t.class}반 ${t.name}</span>
                                <button class="btn-small" onclick="confirmMorningCheck('${t.id}')" style="padding: 6px 12px; font-size: 13px;">확인</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                document.getElementById('todayBox').innerHTML = '';
            }

            renderPreview();

            const stats = {};
            Object.keys(records).forEach(date => {
                records[date].forEach(r => {
                    if (!stats[r.reason]) stats[r.reason] = {};
                    if (!stats[r.reason][date]) stats[r.reason][date] = 0;
                    stats[r.reason][date]++;
                });
            });

            let html = `
                <div class="stat-card" onclick="showDetail('지각')">
                    <div class="stat-label">지각</div>
                    <div class="stat-value">${Object.values(stats['지각'] || {}).reduce((a,b) => a+b, 0)}</div>
                </div>
                <div class="stat-card" onclick="showDetail('화장')">
                    <div class="stat-label">화장</div>
                    <div class="stat-value">${Object.values(stats['화장'] || {}).reduce((a,b) => a+b, 0)}</div>
                </div>
                <div class="stat-card" onclick="showDetail('복장')">
                    <div class="stat-label">복장</div>
                    <div class="stat-value">${Object.values(stats['복장'] || {}).reduce((a,b) => a+b, 0)}</div>
                </div>
            `;
            document.getElementById('statsContainer').innerHTML = html;

            if (selectedDetail) {
                const dates = Object.keys(stats[selectedDetail] || {}).sort().reverse();
                document.getElementById('detailContainer').innerHTML = `
                    <h3 style="margin-top: 16px; margin-bottom: 8px;">${selectedDetail} 위반 날짜</h3>
                    <div class="detail-list">
                        ${dates.map(d => `<div class="detail-item">${d} (${stats[selectedDetail][d]}건)</div>`).join('')}
                    </div>
                    <button class="secondary" onclick="selectedDetail = null; render()" style="width: 100%; margin-top: 12px;">닫기</button>
                `;
            } else {
                document.getElementById('detailContainer').innerHTML = '';
            }
        }

        function showDetail(reason) {
            selectedDetail = reason;
            render();
        }

        function renderByClass() {
            updateAllDates();
            const students = {};
            const studentReasons = {};  // 학생별 사유별 건수
            const classes = new Set();
            
            Object.keys(records).forEach(date => {
                records[date].forEach(r => {
                    const key = `${r.grade}-${r.class}`;
                    const studentKey = `${key}-${r.name}`;
                    classes.add(key);
                    if (!students[key]) students[key] = {};
                    if (!students[key][r.name]) students[key][r.name] = 0;
                    if (!studentReasons[studentKey]) studentReasons[studentKey] = {};
                    if (!studentReasons[studentKey][r.reason]) studentReasons[studentKey][r.reason] = 0;
                    
                    students[key][r.name]++;
                    studentReasons[studentKey][r.reason]++;
                });
            });

            const classArray = Array.from(classes).sort();
            const selectedClass = document.getElementById('classFilter')?.value || (classArray[0] || '');
            
            let html = `
                <div class="card" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label>학반 선택</label>
                        <select id="classFilter" onchange="renderByClass()" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                            <option value="">전체 학반</option>
                            ${classArray.map(key => {
                                const [g, c] = key.split('-');
                                return `<option value="${key}">${g}학년 ${c}반</option>`;
                            }).join('')}
                        </select>
                    </div>
                </div>
            `;

            if (selectedClass) {
                const [g, c] = selectedClass.split('-');
                html += `<div class="card"><h3>${g}학년 ${c}반</h3>`;
                Object.keys(students[selectedClass]).sort().forEach(name => {
                    const studentKey = `${selectedClass}-${name}`;
                    const reasons = studentReasons[studentKey] || {};
                    const reasonStr = Object.keys(reasons)
                        .map(r => `${r} ${reasons[r]}회`)
                        .join(', ');
                    
                    html += `
                        <div class="student-item" onclick="showStudentDetail('${g}', '${c}', '${name}')">
                            <div class="student-info">
                                <h4>${name}</h4>
                                <p>${reasonStr || '기록 없음'}</p>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else if (classArray.length > 0) {
                classArray.forEach(key => {
                    const [g, c] = key.split('-');
                    html += `<div class="card"><h3>${g}학년 ${c}반</h3>`;
                    Object.keys(students[key]).sort().forEach(name => {
                        const studentKey = `${key}-${name}`;
                        const reasons = studentReasons[studentKey] || {};
                        const reasonStr = Object.keys(reasons)
                            .map(r => `${r} ${reasons[r]}회`)
                            .join(', ');
                        
                        html += `
                            <div class="student-item" onclick="showStudentDetail('${g}', '${c}', '${name}')">
                                <div class="student-info">
                                    <h4>${name}</h4>
                                    <p>${reasonStr || '기록 없음'}</p>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                });
            } else {
                html += '<div class="card"><div class="empty">기록된 학생이 없습니다</div></div>';
            }

            document.getElementById('byclassContainer').innerHTML = html;
        }

        function showStudentDetail(g, c, name) {
            const list = [];
            Object.keys(records).forEach(date => {
                records[date].forEach(r => {
                    if (r.grade === g && r.class === c && r.name === name) {
                        list.push({date, reason: r.reason});
                    }
                });
            });
            
            let html = `<div class="card"><h3>${name} 상세 기록</h3><div class="detail-list">`;
            list.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(l => {
                html += `<div class="detail-item">${l.date} - ${l.reason}</div>`;
            });
            html += `</div><button class="secondary" onclick="renderByClass()" style="width: 100%; margin-top: 12px;">닫기</button></div>`;
            document.getElementById('byclassContainer').innerHTML = html;
        }

        function renderWork() {
            updateAllDates();
            const today = getTodayDate();
            const incompleteToday = workTasks.filter(t => t.date === today && t.status === '작성중');
            
            if (workTasks.length === 0) {
                document.getElementById('workContainer').innerHTML = '<div class="empty">빡지 지정 대기 중</div>';
                return;
            }

            let html = '';
            
            // 미완료 경고 (당일 이상)
            const incomplete = workTasks.filter(t => t.status === '작성중');
            if (incomplete.length > 0) {
                html += `<div style="background-color: #ffebee; border-left: 4px solid #f44336; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
                    <div style="color: #c62828; font-weight: 600; margin-bottom: 8px;">⚠️ 미완료 (${incomplete.length}명)</div>
                    ${incomplete.map(t => `<div style="color: #d32f2f; padding: 4px 0;">${t.date} - ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('')}
                </div>`;
            }

            html += workTasks.map(t => {
                const statusLabel = t.status === '작성중' ? '⏳ 작성중' : '✅ 완료';
                const statusStyle = t.status === '작성중' 
                    ? 'color: #f57c00; font-weight: 600;'
                    : 'color: #388e3c; font-weight: 600;';
                
                return `
                    <div class="student-item" style="opacity: ${t.status === '완료' ? '0.6' : '1'};">
                        <div class="student-info">
                            <h4>${t.studentName}</h4>
                            <p>${t.grade}학년 ${t.class}반 | ${t.date}</p>
                        </div>
                        <div style="${statusStyle}">${statusLabel}</div>
                        ${t.status === '작성중' 
                            ? `<button class="btn-small" onclick="updateWorkStatus('${t.id}', '완료')">완료</button>`
                            : `<button class="btn-small" onclick="updateWorkStatus('${t.id}', '작성중')" style="background: #e0e0e0; color: #666;">취소</button>`
                        }
                    </div>
                `;
            }).join('');

            document.getElementById('workContainer').innerHTML = html;
        }

        function updateWorkStatus(id, status) {
            const task = workTasks.find(t => t.id == id);
            if (task) {
                task.status = status;
                save();
                renderWork();
            }
        }

        function renderClean() {
            updateAllDates();
            
            if (cleanTasks.length === 0) {
                document.getElementById('cleanContainer').innerHTML = '<div class="empty">청소 지정 대기 중</div>';
                return;
            }

            let html = '';
            
            // 미완료 경고 (당일 이상)
            const incomplete = cleanTasks.filter(t => t.status === '작성중');
            if (incomplete.length > 0) {
                html += `<div style="background-color: #ffebee; border-left: 4px solid #f44336; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
                    <div style="color: #c62828; font-weight: 600; margin-bottom: 8px;">⚠️ 미완료 (${incomplete.length}명)</div>
                    ${incomplete.map(t => `<div style="color: #d32f2f; padding: 4px 0;">${t.date} - ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('')}
                </div>`;
            }

            html += cleanTasks.map(t => {
                const statusLabel = t.status === '작성중' ? '⏳ 작성중' : '✅ 완료';
                const statusStyle = t.status === '작성중' 
                    ? 'color: #f57c00; font-weight: 600;'
                    : 'color: #388e3c; font-weight: 600;';
                
                return `
                    <div class="student-item" style="opacity: ${t.status === '완료' ? '0.6' : '1'};">
                        <div class="student-info">
                            <h4>${t.studentName}</h4>
                            <p>${t.grade}학년 ${t.class}반 | ${t.date}</p>
                        </div>
                        <div style="${statusStyle}">${statusLabel}</div>
                        ${t.status === '작성중' 
                            ? `<button class="btn-small" onclick="updateCleanStatus('${t.id}', '완료')">완료</button>`
                            : `<button class="btn-small" onclick="updateCleanStatus('${t.id}', '작성중')" style="background: #e0e0e0; color: #666;">취소</button>`
                        }
                    </div>
                `;
            }).join('');

            document.getElementById('cleanContainer').innerHTML = html;
        }

        function updateCleanStatus(id, status) {
            const task = cleanTasks.find(t => t.id == id);
            if (task) {
                task.status = status;
                save();
                renderClean();
            }
        }

        function renderMorningInputs() {
            const inp = morningInputs[0];
            const html = `
                <div>
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr 2fr 1fr; gap: 8px; align-items: center;">
                        <div>
                            <label style="font-size: 12px; color: #666;">날짜</label>
                            <input type="date" value="${inp.date}" onchange="morningInputs[0].date = this.value" style="width: 100%;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666;">학년</label>
                            <input type="number" placeholder="학년" value="${inp.grade}" onchange="morningInputs[0].grade = parseInt(this.value) || ''" style="width: 100%;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666;">반</label>
                            <input type="number" placeholder="반" value="${inp.class}" onchange="morningInputs[0].class = parseInt(this.value) || ''" style="width: 100%;">
                        </div>
                        <div>
                            <label style="font-size: 12px; color: #666;">이름</label>
                            <input type="text" placeholder="이름" value="${inp.name}" onchange="morningInputs[0].name = this.value" style="width: 100%;">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 8px;">
                        <label style="font-size: 12px; color: #666;">사유</label>
                        <textarea placeholder="사유 입력" onchange="morningInputs[0].reason = this.value" style="width: 100%; min-height: 60px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">${inp.reason}</textarea>
                    </div>
                </div>
            `;
            document.getElementById('morningInputsContainer').innerHTML = html;
        }

        function saveMorningCheck() {
            const inp = morningInputs[0];
            
            if (!inp.date || !inp.grade || !inp.class || !inp.name || !inp.name.trim()) {
                alert('완전히 입력해주세요!');
                return;
            }

            morningCheck.push({
                id: Date.now() + Math.random(),
                date: inp.date,
                grade: typeof inp.grade === 'number' ? inp.grade : parseInt(inp.grade),
                class: typeof inp.class === 'number' ? inp.class : parseInt(inp.class),
                name: inp.name.trim(),
                reason: (inp.reason || '').trim(),
                confirmed: false
            });

            morningInputs = [{ date: getTodayDate(), grade: '', class: '', name: '', reason: '' }];
            save();
            renderMorning();
            alert('저장되었습니다!');
        }

        function renderMorning() {
            updateAllDates();
            renderMorningInputs();
            
            // 미확인 학생들 (예정 날짜 이상)
            const today = getTodayDate();
            const unconfirmed = morningCheck.filter(m => !m.confirmed && m.date <= today).sort((a, b) => new Date(b.date) - new Date(a.date));
            let alertHtml = '';
            
            if (unconfirmed.length > 0) {
                alertHtml = `<div class="card" style="background-color: #ffebee; border-left: 4px solid #f44336; margin-bottom: 16px;">
                    <h3 style="color: #c62828; margin-top: 0;">🔔 미확인 학생</h3>`;
                unconfirmed.forEach(m => {
                    alertHtml += `<div style="padding: 8px; color: #d32f2f;">${m.date} 확인예정: ${m.grade}학년 ${m.class}반 ${m.name}</div>`;
                });
                alertHtml += `</div>`;
            }
            
            document.getElementById('morningAlertContainer').innerHTML = alertHtml;
            
            if (morningCheck.length === 0) {
                document.getElementById('morningListContainer').innerHTML = '<div class="empty">등록된 아침확인이 없습니다</div>';
                return;
            }
            
            let html = morningCheck.sort((a, b) => new Date(b.date) - new Date(a.date)).map(m => `
                <div class="student-item" style="background-color: ${m.confirmed ? '#e8f5e9' : '#fff9c4'}; display: flex; justify-content: space-between; align-items: center;">
                    <div class="student-info">
                        <h4>${m.date} | ${m.grade}학년 ${m.class}반 ${m.name}</h4>
                        <p>${m.reason || '(사유 없음)'} ${m.confirmed ? '✓ 확인됨' : '(미확인)'}</p>
                    </div>
                    ${m.confirmed 
                        ? `<div style="color: #388e3c; font-weight: 600;">✅ 완료</div>`
                        : `<button class="btn-small" onclick="confirmMorningCheck('${m.id}')" style="padding: 6px 12px; font-size: 13px;">확인</button>`
                    }
                </div>
            `).join('');
            document.getElementById('morningListContainer').innerHTML = html;
        }

        render();
    </script>
</body>
</html>
