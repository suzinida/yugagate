<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 생활지도 관리 시스템</title>
    
    <!-- Firebase SDK (Compat 버전) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px 0;
            overflow-y: auto;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #666;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9f9f9;
            color: #333;
        }

        .nav-item.active {
            background: #f0f7ff;
            border-left-color: #378ADD;
            color: #378ADD;
            font-weight: 600;
        }

        .nav-section {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-top: 16px;
        }

        .main {
            padding: 32px;
            overflow-y: auto;
        }

        .header-date {
            display: inline-block;
            background: #378ADD;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 { font-size: 28px; margin-bottom: 24px; font-weight: 600; }
        h2 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #378ADD;
            color: white;
            transition: all 0.2s;
        }

        button:hover { background: #2563c4; }

        button.secondary { background: #f0f0f0; color: #333; }
        button.secondary:hover { background: #e0e0e0; }

        .reason-btn {
            border: 3px solid transparent !important;
            padding: 8px 12px !important;
            transition: all 0.2s !important;
            font-weight: 600;
            font-size: 13px !important;
        }

        .reason-btn.selected {
            border: 3px solid currentColor !important;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.1), inset 0 0 8px currentColor !important;
            font-weight: 900 !important;
            filter: brightness(0.85);
        }

        .button-group { display: flex; gap: 8px; margin-top: 16px; }
        button { flex: 1; }

        .page { display: none; }
        .page.active { display: block; }

        .student-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #378ADD;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info h4 { font-size: 14px; margin-bottom: 4px; }
        .student-info p { font-size: 12px; color: #666; }

        .stat-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            display: inline-block;
            width: calc(33.333% - 8px);
            margin-right: 12px;
            margin-bottom: 12px;
        }

        .class-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
        }

        .class-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .strikethrough {
            text-decoration: line-through;
            color: #999;
        }

        .stat-label { font-size: 12px; color: #666; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #378ADD; }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            background: #378ADD;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .modal button {
            padding: 12px 16px !important;
            font-size: 14px !important;
            cursor: pointer !important;
        }

        .modal .button-group {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .hamburger { display: block; }
            .sidebar {
                position: fixed;
                left: -200px;
                top: 0; bottom: 0;
                width: 200px;
                z-index: 999;
                transition: left 0.3s;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }
            .sidebar.active { left: 0; }
            .main { padding: 12px; }
            .card { padding: 12px; margin-bottom: 12px; }
            h1 { font-size: 20px; margin-bottom: 12px; }
            h2 { font-size: 16px; margin-bottom: 12px; }
            h3 { font-size: 14px; }
            h4 { font-size: 13px; }
            p { font-size: 12px; }
            
            .form-row { grid-template-columns: 1fr; gap: 6px; }
            .form-group { margin-bottom: 8px; }
            .form-group label { font-size: 11px; margin-bottom: 3px; }
            input, select, textarea { padding: 8px; font-size: 13px; }
            button { padding: 8px 12px; font-size: 13px; }
            
            .button-group { gap: 6px; }
            .reason-btn { padding: 6px 10px !important; font-size: 12px !important; }
            
            .stat-card { width: 100%; margin-right: 0; padding: 12px; }
            .stat-label { font-size: 11px; }
            .stat-value { font-size: 24px; }
            
            .student-item { padding: 10px; margin-bottom: 6px; }
            .student-item h4 { margin-bottom: 2px; }
            .student-item p { margin: 0; }
            
            .btn-small { padding: 5px 10px; font-size: 11px; }
            
            .header-date { padding: 6px 12px; font-size: 12px; }
            .class-card { padding: 12px; font-size: 14px; margin-bottom: 8px; }
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()">☰</button>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="nav-item active" onclick="switchPage('home')">🏠 홈</div>
            <div class="nav-item" onclick="switchPage('byclass')">👥 학반별관리</div>
            <div class="nav-section">학생부 지도</div>
            <div class="nav-item" onclick="switchPage('work')">📝 빡지관리</div>
            <div class="nav-item" onclick="switchPage('clean')">✨ 청소관리</div>
            <div class="nav-item" onclick="switchPage('morning')">🌅 아침확인</div>
            <div class="nav-item" onclick="switchPage('settings')">🔧 설정</div>
        </div>

        <div class="main">
            <!-- 홈 -->
            <div id="home" class="page active">
                <div class="header-date" id="todayDate"></div>
                <h1>📋 등교지도</h1>

                <!-- 생활지도 입력 -->
                <div class="card">
                    <h2>학생 조회</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학년</label>
                            <select id="inputGrade" onchange="updateClassDropdown()">
                                <option value="">선택</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>반</label>
                            <select id="inputClass">
                                <option value="">선택</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="inputName" placeholder="학생 이름 입력">
                    </div>
                    <button onclick="queryRecords()" style="width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer;">🔍 조회</button>
                </div>

                <!-- 조회 결과 (지도내용 사유별) -->
                <div id="queryResultContainer"></div>

                <!-- 사유 선택 & 저장 -->
                <div id="reasonSelectContainer"></div>
            </div>

            <!-- 학반별 관리 -->
            <div id="byclass" class="page">
                <div class="header-date" id="byclassDate"></div>
                <h1>👥 학반별 관리</h1>
                <div id="byclassContainer"></div>
                <div id="studentDetailContainer"></div>
            </div>

            <!-- 빡지관리 -->
            <div id="work" class="page">
                <div class="header-date" id="workDate"></div>
                <h1>📝 빡지관리</h1>
                <div id="workContainer"></div>
            </div>

            <!-- 청소관리 -->
            <div id="clean" class="page">
                <div class="header-date" id="cleanDate"></div>
                <h1>✨ 청소관리</h1>
                <div id="cleanContainer"></div>
            </div>

            <!-- 아침확인 -->
            <div id="morning" class="page">
                <div class="header-date" id="morningDate"></div>
                <h1>🌅 아침확인</h1>
                <div class="card">
                    <h2>아침확인 입력</h2>
                    <div class="form-group">
                        <label>확인 일자</label>
                        <input type="date" id="morningDate_input">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학년</label>
                            <select id="morningGrade" onchange="updateMorningClassDropdown(); ">
                                <option value="">선택</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>반</label>
                            <select id="morningClass" onchange="morningInputs[0].class = parseInt(this.value) || ''">
                                <option value="">선택</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="morningName" placeholder="이름" onchange="morningInputs[0].name = this.value">
                    </div>
                    <div class="form-group">
                        <label>사유</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                            <button class="reason-btn" onclick="setMorningReason('지각')" id="mbtn-지각" style="background: #fff3e0; color: #e65100;">지각</button>
                            <button class="reason-btn" onclick="setMorningReason('복장')" id="mbtn-복장" style="background: #fce4ec; color: #c2185b;">복장</button>
                            <button class="reason-btn" onclick="setMorningReason('화장')" id="mbtn-화장" style="background: #f3e5f5; color: #6a1b9a;">화장</button>
                            <button class="reason-btn" onclick="setMorningReason('기타')" id="mbtn-기타" style="background: #e0f2f1; color: #00695c;">기타</button>
                        </div>
                        <input type="text" id="morningReasonOther" placeholder="기타 사유 입력">
                    </div>
                    <button onclick="saveMorningCheck()" style="width: 100%;">💾 저장</button>
                </div>
                <div class="card">
                    <h2>등록된 아침확인</h2>
                    <div id="morningListContainer"></div>
                </div>
            </div>

            <!-- 설정 -->
            <div id="settings" class="page">
                <div class="header-date"></div>
                <h1>🔧 설정</h1>
                <div class="card">
                    <h2 style="color: #dc2626;">⚠️ 위험한 작업</h2>
                    <p style="color: #666; margin-bottom: 16px; font-size: 14px;">학기가 종료되면 모든 기록을 삭제하고 새로 시작할 수 있습니다.</p>
                    <button type="button" onclick="showSemesterEndPassword()" style="width: 100%; background: #dc2626; color: white; padding: 12px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 14px;">📚 학기 종료</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 학기 종료 비밀번호 모달 -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3>학기 종료</h3>
            <p style="color: #666; margin-bottom: 16px;">모든 기록을 삭제하시겠습니까?<br>비밀번호를 입력해주세요.</p>
            <input type="password" id="semesterEndPassword" placeholder="비밀번호" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box;">
            <div class="button-group">
                <button type="button" class="secondary" id="cancelBtn" style="cursor: pointer;">취소</button>
                <button type="button" id="confirmBtn" style="background: #dc2626; color: white; cursor: pointer;">학기 종료</button>
            </div>
        </div>
    </div>
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>저장 확인</h3>
            <p id="confirmMessage"></p>
            <div class="button-group">
                <button class="secondary" onclick="closeConfirmModal(); return false;">취소</button>
                <button onclick="confirmSave(); return false;">저장</button>
            </div>
        </div>
    </div>

    <script>
        let db, records = {}, morningCheck = [], workTasks = [], cleanTasks = [];
        let selectedReason = '', selectedMorningReason = '';
        let isLoading = true;

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDekIKrzT2lM-QE_6EwOd-_9SSeRWkAJxE",
            authDomain: "yugagate-62119.firebaseapp.com",
            projectId: "yugagate-62119",
            storageBucket: "yugagate-62119.firebasestorage.app",
            messagingSenderId: "491917125896",
            appId: "1:491917125896:web:5b057fed15fcc4660264bd",
            databaseURL: "https://yugagate-62119-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // Firebase 초기화
        function initializeFirebase() {
            try {
                if (typeof firebase !== 'undefined' && firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    console.log('✅ Firebase 초기화 완료');
                    
                    // Firebase 데이터 로드
                    db.ref().once('value', snap => {
                        const data = snap.val();
                        if (data) {
                            records = data.records || {};
                            morningCheck = data.morningCheck || [];
                            workTasks = data.workTasks || [];
                            cleanTasks = data.cleanTasks || [];
                        }
                        setupFirebaseListeners();
                    }).catch((error) => {
                        console.error('❌ Firebase 데이터 로드 오류:', error);
                        isLoading = false; 
                    });
                }
            } catch (error) {
                console.error('❌ Firebase 초기화 오류:', error);
            }
        }

        // 페이지 로드 완료 후 Firebase 초기화
        window.addEventListener('load', () => {
            console.log('✅ 페이지 로드 완료');
            setTimeout(() => {
                if (typeof firebase !== 'undefined') {
                    initializeFirebase();
                } else {
                    console.error('❌ Firebase SDK를 찾을 수 없습니다');
                    alert('Firebase 로드 실패. 페이지를 새로고침해주세요.');
                }
            }, 500);
        });

        // DOM 로드 완료
        window.addEventListener('DOMContentLoaded', () => {
            console.log('✅ DOM 로드 완료');
            updateAllDates();
        });
        
        function setMorningReason(reason) {
            selectedMorningReason = reason;
            document.querySelectorAll('#morning .reason-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('mbtn-' + reason).classList.add('selected');
        }

        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function updateClassDropdown() {
            const grade = document.getElementById('inputGrade').value;
            const classSelect = document.getElementById('inputClass');
            classSelect.innerHTML = '<option value="">선택</option>';

            let maxClass = 0;
            if (grade === '1') maxClass = 11;
            else if (grade === '2') maxClass = 12;
            else if (grade === '3') maxClass = 11;

            for (let i = 1; i <= maxClass; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '반';
                classSelect.appendChild(opt);
            }
        }

        function updateMorningClassDropdown() {
            const grade = document.getElementById('morningGrade').value;
            const classSelect = document.getElementById('morningClass');
            classSelect.innerHTML = '<option value="">선택</option>';

            let maxClass = 0;
            if (grade === '1') maxClass = 11;
            else if (grade === '2') maxClass = 12;
            else if (grade === '3') maxClass = 11;

            for (let i = 1; i <= maxClass; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '반';
                classSelect.appendChild(opt);
            }
        }

        function updateAllDates() {
            const d = new Date(getTodayDate());
            const days = ['(일)', '(월)', '(화)', '(수)', '(목)', '(금)', '(토)'];
            const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}`;
            document.querySelectorAll('[id$="Date"]').forEach(el => el.textContent = dateStr);
        }

        function setupFirebaseListeners() {
            db.ref('records').on('value', snap => { 
                records = snap.val() || {}; 
                if (!isLoading) {
                    render();
                    if (document.getElementById('byclass')?.classList.contains('active')) renderByClass();
                }
            });
            db.ref('morningCheck').on('value', snap => { 
                morningCheck = snap.val() || []; 
                if (!isLoading) {
                    if (document.getElementById('morning')?.classList.contains('active')) renderMorning();
                    if (document.getElementById('byclass')?.classList.contains('active')) renderByClass();
                }
            });
            db.ref('workTasks').on('value', snap => { 
                workTasks = snap.val() || []; 
                if (!isLoading) {
                    if (document.getElementById('work')?.classList.contains('active')) renderWork();
                    if (document.getElementById('byclass')?.classList.contains('active')) renderByClass();
                    render();
                }
            });
            db.ref('cleanTasks').on('value', snap => { 
                cleanTasks = snap.val() || []; 
                if (!isLoading) {
                    if (document.getElementById('clean')?.classList.contains('active')) renderClean();
                    if (document.getElementById('byclass')?.classList.contains('active')) renderByClass();
                    render();
                }
            });
            isLoading = false;
            render();
        }
        function save() {
            console.log('💾 save() 호출됨');
            console.log('db 상태:', db ? '✅ 연결됨' : '❌ 없음');
            
            if (!db) {
                console.error('❌ Firebase가 아직 준비되지 않았습니다');
                alert('⚠️ Firebase 연결 오류: 새로고침 후 다시 시도하세요');
                return false;
            }
            
            try {
                console.log('📤 records 저장 시작...');
                db.ref('records').set(records, (error) => {
                    if (error) console.error('❌ records 저장 실패:', error);
                    else console.log('✅ records 저장됨');
                });
                
                console.log('📤 morningCheck 저장 시작...');
                db.ref('morningCheck').set(morningCheck, (error) => {
                    if (error) console.error('❌ morningCheck 저장 실패:', error);
                    else console.log('✅ morningCheck 저장됨');
                });
                
                console.log('📤 workTasks 저장 시작...');
                db.ref('workTasks').set(workTasks, (error) => {
                    if (error) console.error('❌ workTasks 저장 실패:', error);
                    else console.log('✅ workTasks 저장됨');
                });
                
                console.log('📤 cleanTasks 저장 시작...');
                db.ref('cleanTasks').set(cleanTasks, (error) => {
                    if (error) console.error('❌ cleanTasks 저장 실패:', error);
                    else console.log('✅ cleanTasks 저장됨');
                });
                
                console.log('✅ save() 모든 저장 시도 완료');
                return true;
            } catch (error) {
                console.error('❌ save() 오류:', error);
                alert('오류: ' + error.message);
                return false;
            }
        }

        function setReason(reason) {
            selectedReason = reason;

            html += `

        let homeSelectedReason = '';

        function setHomeReason(reason) {
            homeSelectedReason = reason;
            document.querySelectorAll('#queryResultContainer .reason-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('homeBtn-' + reason).classList.add('selected');
            
            // 기타 선택 시 입력 필드 표시

            if (reason === '기타') {
                otherInput.style.display = 'block';
            } else {
                otherInput.style.display = 'none';
            }
        }

        function prepareHomeRecord(g, c, n, type) {
            if (!homeSelectedReason) {
                alert('지도 사유를 선택해주세요!');
                return;
            }
            
            const reason = homeSelectedReason === '기타' ? document.getElementById('homeInputReasonOther').value : homeSelectedReason;
            
            if (!reason) {
                alert('모든 항목을 입력해주세요!');
                return;
            }

            homePendingData = { g: parseInt(g), c: parseInt(c), n: n, reason: reason, type: type };
            
            let msg = '';
            if (type === 'work') {
                msg = `${n} 학생에게 빡지를 지정하시겠습니까?\n(사유: ${reason})`;
            } else if (type === 'clean') {
                msg = `${n} 학생에게 청소를 지정하시겠습니까?\n(사유: ${reason})`;
            } else {
                msg = `${n} 학생의 지도를 저장하시겠습니까?\n(사유: ${reason})`;
            }
            
            showConfirmModal(msg);
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            homePendingData = null;
            pendingSaveType = null;
        }

        function confirmSave() {
            if (homePendingData) {
                saveHomeRecordData(homePendingData);
            } else {
                saveOriginal();
            }
            closeConfirmModal();
        }

        function saveHomeRecordData(data) {
            const t = getTodayDate();
            
            try {
                if (data.type === 'work') {
                    // 빡지 지정
                    workTasks.push({
                        id: Date.now() + Math.random(),
                        studentName: data.n,
                        grade: data.g,
                        class: data.c,
                        date: t,
                        status: '작성중'
                    });
                    // 지도 기록도 저장
                    if (!records[t]) records[t] = [];
                    records[t].push({ grade: data.g, class: data.c, name: data.n, reason: data.reason, id: Date.now() + Math.random() });
                } else if (data.type === 'clean') {
                    // 청소 지정
                    cleanTasks.push({
                        id: Date.now() + Math.random(),
                        studentName: data.n,
                        grade: data.g,
                        class: data.c,
                        date: t,
                        status: '작성중'
                    });
                    // 지도 기록도 저장
                    if (!records[t]) records[t] = [];
                    records[t].push({ grade: data.g, class: data.c, name: data.n, reason: data.reason, id: Date.now() + Math.random() });
                } else if (data.type === 'record') {
                    // 지도 기록만 저장
                    if (!records[t]) records[t] = [];
                    records[t].push({ grade: data.g, class: data.c, name: data.n, reason: data.reason, id: Date.now() + Math.random() });
                }
                
                save();
                alert('저장되었습니다!');
                
                // 입력 초기화
                document.getElementById('inputGrade').value = '';
                document.getElementById('inputClass').value = '';
                document.getElementById('inputName').value = '';
                document.getElementById('queryResultContainer').innerHTML = '';
                homeSelectedReason = '';
            } catch (error) {
                console.error('저장 오류:', error);
                alert('저장 중 오류 발생했습니다');
            }
        }

        function assignWork() { pendingSaveType = 'work'; showConfirmModal('빡지를 지정하시겠습니까?'); }
        function assignClean() { pendingSaveType = 'clean'; showConfirmModal('청소를 지정하시겠습니까?'); }
        function saveRecord() { pendingSaveType = 'record'; showConfirmModal('기록을 저장하시겠습니까?'); }

        function showConfirmModal(msg) {
            document.getElementById('confirmMessage').textContent = msg;
            document.getElementById('confirmModal').classList.add('active');
        }

        function saveOriginal() {
            console.log('=== confirmSave 시작 ===');
            console.log('pendingSaveType:', pendingSaveType);
            
            const g = document.getElementById('inputGrade').value;
            const c = document.getElementById('inputClass').value;
            const n = document.getElementById('inputName').value;
            const r = selectedReason === '기타' ? document.getElementById('inputReasonOther').value : selectedReason;
            const t = getTodayDate();

            console.log('입력값:', {학년: g, 반: c, 이름: n, 사유: r});

            if (!g || !c || !n || !r) {

            }

            try {
                if (pendingSaveType === 'record') {
                    if (!records[t]) records[t] = [];
                    records[t].push({ grade: parseInt(g), class: parseInt(c), name: n, reason: r, id: Date.now() + Math.random() });
                    console.log('✅ 누적저장 완료');
                } else if (pendingSaveType === 'work') {
                    const newTask = { id: Date.now() + Math.random(), studentName: n, grade: parseInt(g), class: parseInt(c), date: t, status: '작성중' };
                    workTasks.push(newTask);
                    console.log('✅ 빡지 추가 완료:', newTask);
                } else if (pendingSaveType === 'clean') {
                    const newTask = { id: Date.now() + Math.random(), studentName: n, grade: parseInt(g), class: parseInt(c), date: t, status: '작성중' };
                    cleanTasks.push(newTask);
                    console.log('✅ 청소 추가 완료:', newTask);

                console.log('Firebase 저장 시도...');
                save();

                document.getElementById('inputGrade').value = '';

        function switchPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('sidebar').classList.remove('active');

            if (name === 'home') render();
            if (name === 'byclass') renderByClass();
            if (name === 'work') renderWork();
            if (name === 'clean') renderClean();
            if (name === 'morning') renderMorning();
            if (name === 'settings') updateAllDates();

        function render() {
            updateAllDates();
            const iw = workTasks.filter(t => t.status === '작성중');
            const ic = cleanTasks.filter(t => t.status === '작성중');
            let a = '';
            if (iw.length > 0 || ic.length > 0) {
                a = `<div class="card" style="background-color: #ffe0e0; border-left: 4px solid #f44336; margin-bottom: 16px;"><h3 style="color: #c62828;">⚠️ 미완료 과제</h3>`;
                if (iw.length > 0) a += `<div style="font-weight: 600; color: #d32f2f;">빡지 (${iw.length}명)</div>` + iw.map(t => `<div style="color: #d32f2f;">- ${t.date} | ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('');
                if (ic.length > 0) a += `<div style="font-weight: 600; color: #d32f2f; margin-top: 8px;">청소 (${ic.length}명)</div>` + ic.map(t => `<div style="color: #d32f2f;">- ${t.date} | ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('');
                a += '</div>';
            }
            document.getElementById('alertContainer').innerHTML = a;
        }

        function renderByClass() {
            updateAllDates();
            const st = {}, sr = {};
            Object.keys(records).forEach(d => records[d].forEach(r => {
                const k = `${r.grade}-${r.class}`, sk = `${k}-${r.name}`;
                if (!st[k]) st[k] = {}; if (!st[k][r.name]) st[k][r.name] = 0;
                if (!sr[sk]) sr[sk] = {}; if (!sr[sk][r.reason]) sr[sk][r.reason] = 0;
                st[k][r.name]++; sr[sk][r.reason]++;
            }));

            let h = '';
            
            // 학년별 정렬
            for (let g = 1; g <= 3; g++) {
                let maxClass = g === 1 ? 11 : g === 2 ? 12 : 11;
                for (let c = 1; c <= maxClass; c++) {
                    const k = `${g}-${c}`;
                    if (st[k]) {
                        h += `<div class="class-card" onclick="showClassDetail(${g}, ${c})">${g}학년 ${c}반</div>`;
                    }
                }
            }

            document.getElementById('byclassContainer').innerHTML = h || '<div class="empty">기록이 없습니다</div>';
            document.getElementById('studentDetailContainer').innerHTML = '';
        }

        function showClassDetail(grade, cls) {
            const studentData = {}; // {name: {지각: count, 복장: count, 화장: count, 기타: [...], 빡지미: count, 청소미: count}}
            
            // 지도 기록 수집 (사유별)
            Object.keys(records).forEach(d => records[d].forEach(r => {
                if (r.grade == grade && r.class == cls) {
                    if (!studentData[r.name]) {
                        studentData[r.name] = {지각: 0, 복장: 0, 화장: 0, 기타: [], 빡지미: 0, 청소미: 0};
                    }
                    if (r.reason === '지각' || r.reason === '복장' || r.reason === '화장') {
                        studentData[r.name][r.reason]++;
                    } else {
                        studentData[r.name].기타.push(r.reason);
                    }
                }
            }));
            
            // 빡지 미완료 수집
            workTasks.forEach(t => {
                if (t.grade == grade && t.class == cls && t.status === '작성중') {
                    if (!studentData[t.studentName]) {
                        studentData[t.studentName] = {지각: 0, 복장: 0, 화장: 0, 기타: [], 빡지미: 0, 청소미: 0};
                    }
                    studentData[t.studentName].빡지미++;
                }
            });
            
            // 청소 미완료 수집
            cleanTasks.forEach(t => {
                if (t.grade == grade && t.class == cls && t.status === '작성중') {
                    if (!studentData[t.studentName]) {
                        studentData[t.studentName] = {지각: 0, 복장: 0, 화장: 0, 기타: [], 빡지미: 0, 청소미: 0};
                    }
                    studentData[t.studentName].청소미++;
                }
            });

            if (Object.keys(studentData).length === 0) {
                document.getElementById('studentDetailContainer').innerHTML = '<div class="empty">지도 기록이 없습니다</div>';
                return;
            }

            // 학생 이름 가나다 순 정렬
            const students = Object.keys(studentData).sort();
            let h = `<div class="card" style="margin-top: 20px;"><button class="secondary" onclick="renderByClass()" style="margin-bottom: 12px;">← 뒤로가기</button><h3>${grade}학년 ${cls}반 (지도내용)</h3>`;
            
            students.forEach(name => {
                const data = studentData[name];
                const reasonList = [];
                if (data.지각 > 0) reasonList.push(`지각 ${data.지각}회`);
                if (data.복장 > 0) reasonList.push(`복장 ${data.복장}회`);
                if (data.화장 > 0) reasonList.push(`화장 ${data.화장}회`);
                if (data.기타.length > 0) {
                    const etcMap = {};
                    data.기타.forEach(reason => {
                        etcMap[reason] = (etcMap[reason] || 0) + 1;
                    });
                    Object.keys(etcMap).forEach(reason => {
                        reasonList.push(`${reason} ${etcMap[reason]}회`);
                    });
                }
                
                let pendingInfo = '';
                if (data.빡지미 > 0 || data.청소미 > 0) {
                    pendingInfo = `<div style="display: flex; gap: 8px; margin-top: 8px;">`;
                    if (data.빡지미 > 0) {
                        pendingInfo += `<div style="background: #ffe4e6; padding: 6px 8px; border-radius: 4px; font-size: 11px; color: #f91880; font-weight: 600;">📝 빡지 ${data.빡지미}건</div>`;
                    }
                    if (data.청소미 > 0) {
                        pendingInfo += `<div style="background: #e0f2f1; padding: 6px 8px; border-radius: 4px; font-size: 11px; color: #00695c; font-weight: 600;">✨ 청소 ${data.청소미}건</div>`;
                    }
                    pendingInfo += `</div>`;
                }
                
                h += `<div class="student-item" style="flex-direction: column; align-items: flex-start; border-left: 4px solid #3b82f6; padding-left: 12px;">
                    <h4 style="margin-bottom: 8px; font-weight: 600;">${name}</h4>
                    <div style="background: #eff6ff; padding: 10px; border-radius: 4px; width: 100%; font-size: 13px; line-height: 1.6; margin-bottom: 8px;">
                        <strong>📋 지도내용:</strong> ${reasonList.length > 0 ? reasonList.join(' | ') : '(기록 없음)'}
                    </div>
                    ${pendingInfo}
                </div>`;
            });

            h += '</div>';
            document.getElementById('studentDetailContainer').innerHTML = h;
        }

        function showReasonDetail(classKey, name, reason) {
            const allRecords = {};
            
            Object.keys(records).forEach(d => records[d].forEach(r => {
                const sk = `${classKey}-${name}`;
                if (!allRecords[sk]) allRecords[sk] = {};
                if (!allRecords[sk][reason]) allRecords[sk][reason] = [];
                
                if (r.grade == classKey.split('-')[0] && r.class == classKey.split('-')[1] && r.name === name && r.reason === reason) {
                    allRecords[sk][reason].push(d);
                }
            }));

            const sk = `${classKey}-${name}`;
            const dates = allRecords[sk]?.[reason] || [];
            
            let h = `<div class="card" style="margin-top: 12px; background: #f0f7ff; border-left: 3px solid #378ADD;">
                <h4>${name} - ${reason} (총 ${dates.length}회)</h4>
                ${dates.map(d => `<div style="padding: 6px; color: #666;">📅 ${d}</div>`).join('')}
            </div>`;
            
            document.getElementById('studentDetailContainer').innerHTML = h;
        }

                                        <p style="font-size: 12px; color: #666;">${t.grade}학년 ${t.class}반 | ${t.date}</p>
                                    </div>
                                    <button class="btn-small" onclick="updateWorkStatus('${t.id}', '완료')" style="background: #10b981; color: white; border: none; padding: 3px 5px; border-radius: 3px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 10px;">✅ 완료</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // 완료 섹션
            if (comp.length > 0) {
                h += `
                    <div>
                        <h3 style="margin-bottom: 12px; color: #10b981; display: flex; align-items: center; gap: 8px;">
                            ✅ 완료 (${comp.length}명)
                        </h3>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                            ${comp.map(t => `
                                <div style="background: #f0f9ff; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; opacity: 0.8;">
                                    <div>
                                        <h4 style="margin-bottom: 4px; color: #666; text-decoration: line-through;">${t.studentName}</h4>
                                        <p style="font-size: 12px; color: #999;">${t.grade}학년 ${t.class}반 | ${t.date}</p>
                                    </div>
                                    <button class="btn-small" onclick="updateWorkStatus('${t.id}', '작성중')" style="background: #ef4444; color: white; border: none; padding: 3px 5px; border-radius: 3px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 10px;">↩️ 취소</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('workContainer').innerHTML = h || '<div class="empty">없음</div>';
        }

        function updateWorkStatus(id, s) {
            const t = workTasks.find(x => x.id == id);
            if (t) { t.status = s; save(); renderWork(); }
        }

        function renderClean() {
            updateAllDates();
            const inc = cleanTasks.filter(t => t.status === '작성중');
            const comp = cleanTasks.filter(t => t.status === '완료');
            
            let h = '';
            
            // 작성중 섹션
            if (inc.length > 0) {
                h += `
                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 12px; color: #00695c; display: flex; align-items: center; gap: 8px;">
                            ⏳ 작성중 (${inc.length}명)
                        </h3>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                            ${inc.map(t => `
                                <div style="background: #e0f2f1; border: 2px solid #00695c; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <h4 style="margin-bottom: 4px; color: #333;">${t.studentName}</h4>
                                        <p style="font-size: 12px; color: #666;">${t.grade}학년 ${t.class}반 | ${t.date}</p>
                                    </div>
                                    <button class="btn-small" onclick="updateCleanStatus('${t.id}', '완료')" style="background: #10b981; color: white; border: none; padding: 3px 5px; border-radius: 3px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 10px;">✅ 완료</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // 완료 섹션
            if (comp.length > 0) {
                h += `
                    <div>
                        <h3 style="margin-bottom: 12px; color: #10b981; display: flex; align-items: center; gap: 8px;">
                            ✅ 완료 (${comp.length}명)
                        </h3>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                            ${comp.map(t => `
                                <div style="background: #f0f9ff; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; opacity: 0.8;">
                                    <div>
                                        <h4 style="margin-bottom: 4px; color: #666; text-decoration: line-through;">${t.studentName}</h4>
                                        <p style="font-size: 12px; color: #999;">${t.grade}학년 ${t.class}반 | ${t.date}</p>
                                    </div>
                                    <button class="btn-small" onclick="updateCleanStatus('${t.id}', '작성중')" style="background: #ef4444; color: white; border: none; padding: 3px 5px; border-radius: 3px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 10px;">↩️ 취소</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('cleanContainer').innerHTML = h || '<div class="empty">없음</div>';
        }

        function updateCleanStatus(id, s) {
            const t = cleanTasks.find(x => x.id == id);
            if (t) { t.status = s; save(); renderClean(); }
        }

        function renderMorning() {
            updateAllDates();
            selectedMorningReason = '';
            
            // 입력 폼 초기화
            document.getElementById('morningDate_input').value = getTodayDate();
            document.getElementById('morningGrade').value = '';
            document.getElementById('morningClass').innerHTML = '<option value="">선택</option>';
            document.getElementById('morningName').value = '';
            document.getElementById('morningReasonOther').value = '';
            document.querySelectorAll('#morning .reason-btn').forEach(b => b.classList.remove('selected'));
            
            // 확인 상태별로 분류
            const notConfirmed = morningCheck.filter(m => !m.confirmed).sort((a, b) => new Date(b.date) - new Date(a.date));
            const confirmed = morningCheck.filter(m => m.confirmed).sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let h = '';
            
            // 확인 안 된 항목 섹션
            if (notConfirmed.length > 0) {
                h += `
                    <div style="margin-bottom: 20px;">
                        <h3 style="margin-bottom: 12px; color: #f57c00; display: flex; align-items: center; gap: 8px;">
                            ⏳ 확인 안 됨 (${notConfirmed.length}명)
                        </h3>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                            ${notConfirmed.map(m => `
                                <div style="background: #fff3e0; border: 2px solid #f57c00; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <h4 style="margin-bottom: 4px; color: #333;">${m.name}</h4>
                                        <p style="font-size: 12px; color: #666;">${m.date} | ${m.grade}학년 ${m.class}반 | ${m.reason || '(사유 없음)'}</p>
                                    </div>
                                    <button class="btn-small" onclick="confirmMorningCheck('${m.id}')" style="background: #10b981; color: white; border: none; padding: 3px 5px; border-radius: 3px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 10px;">✅ 확인</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // 확인 완료 항목 섹션
            if (confirmed.length > 0) {
                h += `
                    <div>
                        <h3 style="margin-bottom: 12px; color: #10b981; display: flex; align-items: center; gap: 8px;">
                            ✅ 확인 완료 (${confirmed.length}명)
                        </h3>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
                            ${confirmed.map(m => `
                                <div style="background: #f0f9ff; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; opacity: 0.7;">
                                    <h4 style="margin-bottom: 4px; color: #666; text-decoration: line-through;">${m.name}</h4>
                                    <p style="font-size: 12px; color: #999; text-decoration: line-through;">${m.date} | ${m.grade}학년 ${m.class}반 | ${m.reason || '(사유 없음)'}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('morningListContainer').innerHTML = h || '<div class="empty">등록된 아침확인이 없습니다</div>';
        }

        function saveMorningCheck() {
            const date = document.getElementById('morningDate_input').value;
            const grade = document.getElementById('morningGrade').value;
            const cls = document.getElementById('morningClass').value;
            const name = document.getElementById('morningName').value;
            const reason = selectedMorningReason === '기타' ? document.getElementById('morningReasonOther').value : selectedMorningReason;
            
            if (!date || !grade || !cls || !name || !reason) { 
                alert('모든 항목을 입력해주세요!'); 
                return; 
            }
            
            morningCheck.push({ 
                id: Date.now() + Math.random(), 
                date: date, 
                grade: parseInt(grade), 
                class: parseInt(cls), 
                name: name, 
                reason: reason, 
                confirmed: false 
            });
            
            document.getElementById('morningDate_input').value = getTodayDate();
            document.getElementById('morningGrade').value = '';
            document.getElementById('morningClass').value = '';
            document.getElementById('morningClass').innerHTML = '<option value="">선택</option>';
            document.getElementById('morningName').value = '';
            document.getElementById('morningReasonOther').value = '';
            document.querySelectorAll('#morning .reason-btn').forEach(b => b.classList.remove('selected'));
            selectedMorningReason = '';
            
            save();
            renderMorning();
            alert('저장되었습니다!');
        }

        function confirmMorningCheck(id) {
            const m = morningCheck.find(x => x.id == id);
            if (m) { m.confirmed = true; save(); renderMorning(); }
        }

        // ============ 학기 종료 함수 ============
        function showSemesterEndPassword() {
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('semesterEndPassword').value = '';
            document.getElementById('semesterEndPassword').focus();
        }

        function closeSemesterEndModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        function verifySemesterEndPassword() {
            console.log('학기 종료 함수 실행됨');
            
            const password = document.getElementById('semesterEndPassword').value;
            console.log('입력된 비밀번호:', password);
            
            if (password === '') {
                alert('비밀번호를 입력해주세요!');
                return;
            }
            
            if (password !== '486') {
                alert('비밀번호가 틀렸습니다!');
                document.getElementById('semesterEndPassword').value = '';
                return;
            }
            
            // 최종 확인
            if (!confirm('정말로 모든 기록을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다!')) {
                return;
            }
            
            console.log('모든 데이터 초기화 시작');
            
            // 모든 데이터 초기화
            records = {};
            morningCheck = [];
            workTasks = [];
            cleanTasks = [];
            
            // Firebase 저장 시도
            if (typeof db !== 'undefined' && db !== null) {
                try {
                    db.ref('records').set({});
                    db.ref('morningCheck').set([]);
                    db.ref('workTasks').set([]);
                    db.ref('cleanTasks').set([]);
                    console.log('Firebase에 저장 완료');
                } catch (error) {
                    console.warn('Firebase 저장 실패 (계속 진행):', error);
                }
            } else {
                console.log('Firebase 연결 없음 (로컬에서만 삭제)');
            }
            
            closeSemesterEndModal();
            alert('✅ 모든 기록이 삭제되었습니다!\n방학을 축하드립니다! 🎉');
            
            // 홈으로 이동
            setTimeout(() => {
                location.reload();
            }, 500);
        }

        // ============ 모달 버튼 이벤트 리스너 ============
        document.addEventListener('DOMContentLoaded', () => {
            const cancelBtn = document.getElementById('cancelBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            
            if (cancelBtn) {
                cancelBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    closeSemesterEndModal();
                });
            }
            
            if (confirmBtn) {
                confirmBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    verifySemesterEndPassword();
                });
            }
        });

        updateAllDates();
    </script>
</body>
</html>
