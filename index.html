<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 생활지도 관리 시스템</title>
    
    <!-- Firebase SDK -->
    <script async defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script async defer src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px 0;
            overflow-y: auto;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #666;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9f9f9;
            color: #333;
        }

        .nav-item.active {
            background: #f0f7ff;
            border-left-color: #378ADD;
            color: #378ADD;
            font-weight: 600;
        }

        .nav-section {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            margin-top: 16px;
        }

        .main {
            padding: 32px;
            overflow-y: auto;
        }

        .header-date {
            display: inline-block;
            background: #378ADD;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 { font-size: 28px; margin-bottom: 24px; font-weight: 600; }
        h2 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #378ADD;
            color: white;
            transition: all 0.2s;
        }

        button:hover { background: #2563c4; }

        button.secondary { background: #f0f0f0; color: #333; }
        button.secondary:hover { background: #e0e0e0; }

        .reason-btn {
            border: 3px solid transparent !important;
            padding: 8px 12px !important;
            transition: all 0.2s !important;
            font-weight: 600;
            font-size: 13px !important;
        }

        .reason-btn.selected {
            border: 3px solid currentColor !important;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.1), inset 0 0 8px currentColor !important;
            font-weight: 900 !important;
            filter: brightness(0.85);
        }

        .button-group { display: flex; gap: 8px; margin-top: 16px; }
        button { flex: 1; }

        .page { display: none; }
        .page.active { display: block; }

        .student-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #378ADD;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info h4 { font-size: 14px; margin-bottom: 4px; }
        .student-info p { font-size: 12px; color: #666; }

        .stat-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            display: inline-block;
            width: calc(33.333% - 8px);
            margin-right: 12px;
            margin-bottom: 12px;
        }

        .class-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
        }

        .class-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .strikethrough {
            text-decoration: line-through;
            color: #999;
        }

        .stat-label { font-size: 12px; color: #666; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #378ADD; }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            background: #378ADD;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .modal button {
            padding: 12px 16px !important;
            font-size: 14px !important;
            cursor: pointer !important;
        }

        .modal .button-group {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .hamburger { display: block; }
            .sidebar {
                position: fixed;
                left: -200px;
                top: 0; bottom: 0;
                width: 200px;
                z-index: 999;
                transition: left 0.3s;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }
            .sidebar.active { left: 0; }
            .main { padding: 12px; }
            .card { padding: 12px; margin-bottom: 12px; }
            h1 { font-size: 20px; margin-bottom: 12px; }
            h2 { font-size: 16px; margin-bottom: 12px; }
            h3 { font-size: 14px; }
            h4 { font-size: 13px; }
            p { font-size: 12px; }
            
            .form-row { grid-template-columns: 1fr; gap: 6px; }
            .form-group { margin-bottom: 8px; }
            .form-group label { font-size: 11px; margin-bottom: 3px; }
            input, select, textarea { padding: 8px; font-size: 13px; }
            button { padding: 8px 12px; font-size: 13px; }
            
            .button-group { gap: 6px; }
            .reason-btn { padding: 6px 10px !important; font-size: 12px !important; }
            
            .stat-card { width: 100%; margin-right: 0; padding: 12px; }
            .stat-label { font-size: 11px; }
            .stat-value { font-size: 24px; }
            
            .student-item { padding: 10px; margin-bottom: 6px; }
            .student-item h4 { margin-bottom: 2px; }
            .student-item p { margin: 0; }
            
            .btn-small { padding: 5px 10px; font-size: 11px; }
            
            .header-date { padding: 6px 12px; font-size: 12px; }
            .class-card { padding: 12px; font-size: 14px; margin-bottom: 8px; }
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()">☰</button>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="nav-item active" onclick="switchPage('home')">🏠 홈</div>
            <div class="nav-item" onclick="switchPage('byclass')">👥 학반별관리</div>
            <div class="nav-section">학생부 지도</div>
            <div class="nav-item" onclick="switchPage('work')">📝 빡지관리</div>
            <div class="nav-item" onclick="switchPage('clean')">✨ 청소관리</div>
            <div class="nav-item" onclick="switchPage('morning')">🌅 아침확인</div>
        </div>

        <div class="main">
            <!-- 홈 -->
            <div id="home" class="page active">
                <div class="header-date" id="todayDate"></div>
                <h1>📋 등교지도</h1>
                <div id="alertContainer"></div>

                <!-- 생활지도 입력 -->
                <div class="card">
                    <h2>생활지도 입력</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학년</label>
                            <select id="inputGrade" onchange="updateClassDropdown(); updatePreview()">
                                <option value="">선택</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>반</label>
                            <select id="inputClass" onchange="updatePreview()">
                                <option value="">선택</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="inputName" placeholder="이름" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>사유</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                            <button class="reason-btn" onclick="setReason('지각')" id="btn-지각" style="background: #fff3e0; color: #e65100;">지각</button>
                            <button class="reason-btn" onclick="setReason('복장')" id="btn-복장" style="background: #fce4ec; color: #c2185b;">복장</button>
                            <button class="reason-btn" onclick="setReason('화장')" id="btn-화장" style="background: #f3e5f5; color: #6a1b9a;">화장</button>
                            <button class="reason-btn" onclick="setReason('기타')" id="btn-기타" style="background: #e0f2f1; color: #00695c;">기타</button>
                        </div>
                        <input type="text" id="inputReasonOther" placeholder="기타 사유 입력" onchange="updatePreview()">
                    </div>
                    <button onclick="queryRecords()" style="width: 100%;">🔍 조회</button>
                </div>

                <!-- 조회 결과 -->
                <div id="queryResultContainer"></div>

                <!-- 지도 내용 -->
                <div id="previewContainer"></div>


            </div>

            <!-- 학반별 관리 -->
            <div id="byclass" class="page">
                <div class="header-date" id="byclassDate"></div>
                <h1>👥 학반별 관리</h1>
                <div id="byclassContainer"></div>
                <div id="studentDetailContainer"></div>
            </div>

            <!-- 빡지관리 -->
            <div id="work" class="page">
                <div class="header-date" id="workDate"></div>
                <h1>📝 빡지관리</h1>
                <div id="workContainer"></div>
            </div>

            <!-- 청소관리 -->
            <div id="clean" class="page">
                <div class="header-date" id="cleanDate"></div>
                <h1>✨ 청소관리</h1>
                <div id="cleanContainer"></div>
            </div>

            <!-- 아침확인 -->
            <div id="morning" class="page">
                <div class="header-date" id="morningDate"></div>
                <h1>🌅 아침확인</h1>
                <div class="card">
                    <h2>아침확인 입력</h2>
                    <div class="form-group">
                        <label>확인 일자</label>
                        <input type="date" id="morningDate_input">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학년</label>
                            <select id="morningGrade" onchange="updateMorningClassDropdown(); ">
                                <option value="">선택</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>반</label>
                            <select id="morningClass" onchange="morningInputs[0].class = parseInt(this.value) || ''">
                                <option value="">선택</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="morningName" placeholder="이름" onchange="morningInputs[0].name = this.value">
                    </div>
                    <div class="form-group">
                        <label>사유</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                            <button class="reason-btn" onclick="setMorningReason('지각')" id="mbtn-지각" style="background: #fff3e0; color: #e65100;">지각</button>
                            <button class="reason-btn" onclick="setMorningReason('복장')" id="mbtn-복장" style="background: #fce4ec; color: #c2185b;">복장</button>
                            <button class="reason-btn" onclick="setMorningReason('화장')" id="mbtn-화장" style="background: #f3e5f5; color: #6a1b9a;">화장</button>
                            <button class="reason-btn" onclick="setMorningReason('기타')" id="mbtn-기타" style="background: #e0f2f1; color: #00695c;">기타</button>
                        </div>
                        <input type="text" id="morningReasonOther" placeholder="기타 사유 입력">
                    </div>
                    <button onclick="saveMorningCheck()" style="width: 100%;">💾 저장</button>
                </div>
                <div class="card">
                    <h2>등록된 아침확인</h2>
                    <div id="morningListContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 저장 확인 모달 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>저장 확인</h3>
            <p id="confirmMessage"></p>
            <div class="button-group">
                <button class="secondary" onclick="closeConfirmModal(); return false;">취소</button>
                <button onclick="confirmSave(); return false;">저장</button>
            </div>
        </div>
    </div>

    <script>
        let db, records = {}, morningCheck = [], workTasks = [], cleanTasks = [];
        let selectedReason = '', selectedMorningReason = '';
        let isLoading = true;

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDekIKrzT2lM-QE_6EwOd-_9SSeRWkAJxE",
            authDomain: "yugagate-62119.firebaseapp.com",
            projectId: "yugagate-62119",
            storageBucket: "yugagate-62119.firebasestorage.app",
            messagingSenderId: "491917125896",
            appId: "1:491917125896:web:5b057fed15fcc4660264bd",
            databaseURL: "https://yugagate-62119-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // Firebase 초기화 (로드 완료 후)
        window.addEventListener('load', () => {
            if (typeof firebase !== 'undefined') {
                console.log('✅ Firebase SDK 로드됨');
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                console.log('✅ Firebase 초기화 완료');
                
                // Firebase 데이터 로드
                db.ref().once('value', snap => {
                    const data = snap.val();
                    if (data) {
                        records = data.records || {};
                        morningCheck = data.morningCheck || [];
                        workTasks = data.workTasks || [];
                        cleanTasks = data.cleanTasks || [];
                    }
                    setupFirebaseListeners();
                }).catch((error) => {
                    console.error('❌ Firebase 데이터 로드 오류:', error);
                    isLoading = false; 
                    render();
                });
            } else {
                console.error('❌ Firebase SDK를 찾을 수 없습니다');
            }
        });

        // 페이지 로드 완료 후 초기화
        window.addEventListener('DOMContentLoaded', () => {
            console.log('✅ DOM 로드 완료');
            updateAllDates();
        });
        
        function setMorningReason(reason) {
            selectedMorningReason = reason;
            document.querySelectorAll('#morning .reason-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('mbtn-' + reason).classList.add('selected');
        }

        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function updateClassDropdown() {
            const grade = document.getElementById('inputGrade').value;
            const classSelect = document.getElementById('inputClass');
            classSelect.innerHTML = '<option value="">선택</option>';

            let maxClass = 0;
            if (grade === '1') maxClass = 11;
            else if (grade === '2') maxClass = 12;
            else if (grade === '3') maxClass = 11;

            for (let i = 1; i <= maxClass; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '반';
                classSelect.appendChild(opt);
            }
        }

        function updateMorningClassDropdown() {
            const grade = document.getElementById('morningGrade').value;
            const classSelect = document.getElementById('morningClass');
            classSelect.innerHTML = '<option value="">선택</option>';

            let maxClass = 0;
            if (grade === '1') maxClass = 11;
            else if (grade === '2') maxClass = 12;
            else if (grade === '3') maxClass = 11;

            for (let i = 1; i <= maxClass; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '반';
                classSelect.appendChild(opt);
            }
        }

        function updateAllDates() {
            const d = new Date(getTodayDate());
            const days = ['(일)', '(월)', '(화)', '(수)', '(목)', '(금)', '(토)'];
            const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}`;
            document.querySelectorAll('[id$="Date"]').forEach(el => el.textContent = dateStr);
        }

        function setupFirebaseListeners() {
            db.ref('records').on('value', snap => { records = snap.val() || {}; if (!isLoading) render(); });
            db.ref('morningCheck').on('value', snap => { morningCheck = snap.val() || []; if (!isLoading && document.getElementById('morning')?.classList.contains('active')) renderMorning(); });
            db.ref('workTasks').on('value', snap => { workTasks = snap.val() || []; if (!isLoading) { if (document.getElementById('work')?.classList.contains('active')) renderWork(); render(); } });
            db.ref('cleanTasks').on('value', snap => { cleanTasks = snap.val() || []; if (!isLoading) { if (document.getElementById('clean')?.classList.contains('active')) renderClean(); render(); } });
            isLoading = false;
            render();
        }
        function save() {
            if (!db) {
                console.error('❌ Firebase가 아직 준비되지 않았습니다');
                return;
            }
            try {
                db.ref('records').set(records);
                db.ref('morningCheck').set(morningCheck);
                db.ref('workTasks').set(workTasks);
                db.ref('cleanTasks').set(cleanTasks);
                console.log('✅ Firebase 저장 성공');
            } catch (error) {
                console.error('❌ Firebase 저장 오류:', error);
            }
        }

        function setReason(reason) {
            selectedReason = reason;
            document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('btn-' + reason).classList.add('selected');
            updatePreview();
        }

        function updatePreview() {
            const g = document.getElementById('inputGrade').value;
            const c = document.getElementById('inputClass').value;
            const n = document.getElementById('inputName').value;
            const r = selectedReason === '기타' ? document.getElementById('inputReasonOther').value : selectedReason;

            if (g && c && n && r) {
                document.getElementById('previewContainer').innerHTML = `
                    <div class="card" style="background: #f0f7ff; border-left: 3px solid #378ADD;">
                        <h2>지도 내용</h2>
                        <p><strong>${g}학년 ${c}반 ${n}</strong></p>
                        <p>사유: ${r}</p>
                        <div class="button-group">
                            <button onclick="assignWork()">📝 빡지 지정</button>
                            <button onclick="assignClean()">✨ 청소 지정</button>
                            <button class="secondary" onclick="saveRecord()">💾 누적저장</button>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('previewContainer').innerHTML = '';
            }
        }

        function queryRecords() {
            const g = document.getElementById('inputGrade').value;
            const c = document.getElementById('inputClass').value;
            if (!g || !c) { alert('학년과 반을 선택해주세요!'); return; }

            let html = '<div class="card"><h2>조회 결과</h2>';
            let found = false;
            Object.keys(records).forEach(date => {
                records[date].forEach(r => {
                    if (r.grade == g && r.class == c) {
                        html += `<div class="student-item"><strong>${date}</strong> | ${r.name}<p>${r.reason}</p></div>`;
                        found = true;
                    }
                });
            });
            if (!found) html += '<p style="color: #999;">기록이 없습니다</p>';
            html += '</div>';
            document.getElementById('queryResultContainer').innerHTML = html;
        }

        function assignWork() { pendingSaveType = 'work'; showConfirmModal('빡지를 지정하시겠습니까?'); }
        function assignClean() { pendingSaveType = 'clean'; showConfirmModal('청소를 지정하시겠습니까?'); }
        function saveRecord() { pendingSaveType = 'record'; showConfirmModal('기록을 저장하시겠습니까?'); }

        function showConfirmModal(msg) {
            document.getElementById('confirmMessage').textContent = msg;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            pendingSaveType = null;
        }

        function confirmSave() {
            console.log('=== confirmSave 시작 ===');
            console.log('pendingSaveType:', pendingSaveType);
            
            const g = document.getElementById('inputGrade').value;
            const c = document.getElementById('inputClass').value;
            const n = document.getElementById('inputName').value;
            const r = selectedReason === '기타' ? document.getElementById('inputReasonOther').value : selectedReason;
            const t = getTodayDate();

            console.log('입력값:', {학년: g, 반: c, 이름: n, 사유: r});

            if (!g || !c || !n || !r) {
                alert('모든 항목을 입력해주세요!');
                console.log('❌ 검증 실패');
                return false;
            }

            try {
                if (pendingSaveType === 'record') {
                    if (!records[t]) records[t] = [];
                    records[t].push({ grade: parseInt(g), class: parseInt(c), name: n, reason: r, id: Date.now() + Math.random() });
                    console.log('✅ 누적저장 완료');
                } else if (pendingSaveType === 'work') {
                    const newTask = { id: Date.now() + Math.random(), studentName: n, grade: parseInt(g), class: parseInt(c), date: t, status: '작성중' };
                    workTasks.push(newTask);
                    console.log('✅ 빡지 추가 완료:', newTask);
                } else if (pendingSaveType === 'clean') {
                    const newTask = { id: Date.now() + Math.random(), studentName: n, grade: parseInt(g), class: parseInt(c), date: t, status: '작성중' };
                    cleanTasks.push(newTask);
                    console.log('✅ 청소 추가 완료:', newTask);
                }

                console.log('Firebase 저장 시도...');
                save();
                console.log('✅ Firebase 저장 완료');
                
                closeConfirmModal();
                document.getElementById('inputGrade').value = '';
                document.getElementById('inputClass').value = '';
                document.getElementById('inputClass').innerHTML = '<option value="">선택</option>';
                document.getElementById('inputName').value = '';
                document.getElementById('inputReasonOther').value = '';
                document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
                selectedReason = '';
                pendingSaveType = null;
                
                updatePreview();
                console.log('=== confirmSave 완료 ===');
                alert('저장되었습니다!');
                render();
                return false;
            } catch (error) {
                console.error('❌ 오류 발생:', error);
                alert('저장 중 오류 발생: ' + error.message);
                return false;
            }
        }

        function switchPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('sidebar').classList.remove('active');

            if (name === 'home') render();
            if (name === 'byclass') renderByClass();
            if (name === 'work') renderWork();
            if (name === 'clean') renderClean();
            if (name === 'morning') renderMorning();
        }

        function render() {
            updateAllDates();
            const iw = workTasks.filter(t => t.status === '작성중');
            const ic = cleanTasks.filter(t => t.status === '작성중');
            let a = '';
            if (iw.length > 0 || ic.length > 0) {
                a = `<div class="card" style="background-color: #ffe0e0; border-left: 4px solid #f44336; margin-bottom: 16px;"><h3 style="color: #c62828;">⚠️ 미완료 과제</h3>`;
                if (iw.length > 0) a += `<div style="font-weight: 600; color: #d32f2f;">빡지 (${iw.length}명)</div>` + iw.map(t => `<div style="color: #d32f2f;">- ${t.date} | ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('');
                if (ic.length > 0) a += `<div style="font-weight: 600; color: #d32f2f; margin-top: 8px;">청소 (${ic.length}명)</div>` + ic.map(t => `<div style="color: #d32f2f;">- ${t.date} | ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('');
                a += '</div>';
            }
            document.getElementById('alertContainer').innerHTML = a;
        }

        function renderByClass() {
            updateAllDates();
            const st = {}, sr = {};
            Object.keys(records).forEach(d => records[d].forEach(r => {
                const k = `${r.grade}-${r.class}`, sk = `${k}-${r.name}`;
                if (!st[k]) st[k] = {}; if (!st[k][r.name]) st[k][r.name] = 0;
                if (!sr[sk]) sr[sk] = {}; if (!sr[sk][r.reason]) sr[sk][r.reason] = 0;
                st[k][r.name]++; sr[sk][r.reason]++;
            }));

            let h = '';
            
            // 학년별 정렬
            for (let g = 1; g <= 3; g++) {
                let maxClass = g === 1 ? 11 : g === 2 ? 12 : 11;
                for (let c = 1; c <= maxClass; c++) {
                    const k = `${g}-${c}`;
                    if (st[k]) {
                        h += `<div class="class-card" onclick="showClassDetail(${g}, ${c})">${g}학년 ${c}반</div>`;
                    }
                }
            }

            document.getElementById('byclassContainer').innerHTML = h || '<div class="empty">기록이 없습니다</div>';
            document.getElementById('studentDetailContainer').innerHTML = '';
        }

        function showClassDetail(grade, cls) {
            const k = `${grade}-${cls}`;
            const st = {}, sr = {}, allRecords = {};
            
            Object.keys(records).forEach(d => records[d].forEach(r => {
                if (r.grade == grade && r.class == cls) {
                    const sk = `${k}-${r.name}`;
                    if (!st[k]) st[k] = {};
                    if (!st[k][r.name]) st[k][r.name] = 0;
                    if (!sr[sk]) sr[sk] = {};
                    if (!sr[sk][r.reason]) sr[sk][r.reason] = [];
                    if (!allRecords[sk]) allRecords[sk] = {};
                    if (!allRecords[sk][r.reason]) allRecords[sk][r.reason] = [];
                    
                    st[k][r.name]++;
                    sr[sk][r.reason]++;
                    allRecords[sk][r.reason].push(d);
                }
            }));

            if (!st[k]) {
                document.getElementById('studentDetailContainer').innerHTML = '<div class="empty">학생 기록이 없습니다</div>';
                return;
            }

            // 학생 이름 가나다 순 정렬
            const students = Object.keys(st[k]).sort();
            let h = `<div class="card" style="margin-top: 20px;"><button class="secondary" onclick="renderByClass()" style="margin-bottom: 12px;">← 뒤로가기</button><h3>${grade}학년 ${cls}반 학생</h3>`;
            
            students.forEach(name => {
                const sk = `${k}-${name}`;
                const reasons = sr[sk] || {};
                h += `<div class="student-item" style="flex-direction: column; align-items: flex-start;">
                    <h4 style="margin-bottom: 8px;">${name}</h4>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">`;
                
                Object.keys(reasons).forEach(reason => {
                    h += `<button class="btn-small" onclick="showReasonDetail('${k}', '${name}', '${reason}')" style="flex: 1; min-width: 80px;">${reason} (${reasons[reason]})</button>`;
                });
                
                h += `</div></div>`;
            });

            h += '</div>';
            document.getElementById('studentDetailContainer').innerHTML = h;
        }

        function showReasonDetail(classKey, name, reason) {
            const allRecords = {};
            
            Object.keys(records).forEach(d => records[d].forEach(r => {
                const sk = `${classKey}-${name}`;
                if (!allRecords[sk]) allRecords[sk] = {};
                if (!allRecords[sk][reason]) allRecords[sk][reason] = [];
                
                if (r.grade == classKey.split('-')[0] && r.class == classKey.split('-')[1] && r.name === name && r.reason === reason) {
                    allRecords[sk][reason].push(d);
                }
            }));

            const sk = `${classKey}-${name}`;
            const dates = allRecords[sk]?.[reason] || [];
            
            let h = `<div class="card" style="margin-top: 12px; background: #f0f7ff; border-left: 3px solid #378ADD;">
                <h4>${name} - ${reason} (총 ${dates.length}회)</h4>
                ${dates.map(d => `<div style="padding: 6px; color: #666;">📅 ${d}</div>`).join('')}
            </div>`;
            
            document.getElementById('studentDetailContainer').innerHTML = h;
        }

        function renderWork() {
            updateAllDates();
            const inc = workTasks.filter(t => t.status === '작성중');
            let h = '';
            if (inc.length > 0) {
                h += `<div class="card" style="background-color: #ffebee; border-left: 4px solid #f44336;"><h3 style="color: #c62828;">⚠️ 미완료 (${inc.length}명)</h3>${inc.map(t => `<div style="color: #d32f2f;">${t.date} - ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('')}</div>`;
            }
            h += workTasks.map(t => `<div class="student-item"><div><h4>${t.studentName}</h4><p>${t.grade}학년 ${t.class}반 | ${t.date}</p></div><div style="${t.status === '작성중' ? 'color: #f57c00;' : 'color: #388e3c;'} font-weight: 600;">${t.status === '작성중' ? '⏳ 작성중' : '✅ 완료'}</div><button class="btn-small" onclick="updateWorkStatus('${t.id}', '${t.status === '작성중' ? '완료' : '작성중'}')">${t.status === '작성중' ? '완료' : '취소'}</button></div>`).join('');
            document.getElementById('workContainer').innerHTML = h || '<div class="empty">없음</div>';
        }

        function updateWorkStatus(id, s) {
            const t = workTasks.find(x => x.id == id);
            if (t) { t.status = s; save(); renderWork(); }
        }

        function renderClean() {
            updateAllDates();
            const inc = cleanTasks.filter(t => t.status === '작성중');
            let h = '';
            if (inc.length > 0) {
                h += `<div class="card" style="background-color: #ffebee; border-left: 4px solid #f44336;"><h3 style="color: #c62828;">⚠️ 미완료 (${inc.length}명)</h3>${inc.map(t => `<div style="color: #d32f2f;">${t.date} - ${t.grade}학년 ${t.class}반 ${t.studentName}</div>`).join('')}</div>`;
            }
            h += cleanTasks.map(t => `<div class="student-item"><div><h4>${t.studentName}</h4><p>${t.grade}학년 ${t.class}반 | ${t.date}</p></div><div style="${t.status === '작성중' ? 'color: #f57c00;' : 'color: #388e3c;'} font-weight: 600;">${t.status === '작성중' ? '⏳ 작성중' : '✅ 완료'}</div><button class="btn-small" onclick="updateCleanStatus('${t.id}', '${t.status === '작성중' ? '완료' : '작성중'}')">${t.status === '작성중' ? '완료' : '취소'}</button></div>`).join('');
            document.getElementById('cleanContainer').innerHTML = h || '<div class="empty">없음</div>';
        }

        function updateCleanStatus(id, s) {
            const t = cleanTasks.find(x => x.id == id);
            if (t) { t.status = s; save(); renderClean(); }
        }

        function renderMorning() {
            updateAllDates();
            selectedMorningReason = '';
            
            // 입력 폼 초기화
            document.getElementById('morningDate_input').value = getTodayDate();
            document.getElementById('morningGrade').value = '';
            document.getElementById('morningClass').innerHTML = '<option value="">선택</option>';
            document.getElementById('morningName').value = '';
            document.getElementById('morningReasonOther').value = '';
            document.querySelectorAll('#morning .reason-btn').forEach(b => b.classList.remove('selected'));
            
            const t = getTodayDate();
            let h = morningCheck.sort((a, b) => new Date(b.date) - new Date(a.date)).map(m => `
                <div class="student-item" style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                    <div style="flex: 1;">
                        <h4 style="${m.confirmed ? 'class="strikethrough"' : ''}">${m.date} | ${m.grade}학년 ${m.class}반 ${m.name}</h4>
                        <p style="${m.confirmed ? 'class="strikethrough"' : ''}">${m.reason || '(사유 없음)'}</p>
                    </div>
                    ${m.confirmed 
                        ? `<div style="color: #999; font-weight: 600;">✓ 확인</div>`
                        : `<button class="btn-small" onclick="confirmMorningCheck('${m.id}')" style="white-space: nowrap;">확인완료</button>`
                    }
                </div>
            `).join('');
            document.getElementById('morningListContainer').innerHTML = h || '<div class="empty">등록된 아침확인이 없습니다</div>';
        }

        function saveMorningCheck() {
            const date = document.getElementById('morningDate_input').value;
            const grade = document.getElementById('morningGrade').value;
            const cls = document.getElementById('morningClass').value;
            const name = document.getElementById('morningName').value;
            const reason = selectedMorningReason === '기타' ? document.getElementById('morningReasonOther').value : selectedMorningReason;
            
            if (!date || !grade || !cls || !name || !reason) { 
                alert('모든 항목을 입력해주세요!'); 
                return; 
            }
            
            morningCheck.push({ 
                id: Date.now() + Math.random(), 
                date: date, 
                grade: parseInt(grade), 
                class: parseInt(cls), 
                name: name, 
                reason: reason, 
                confirmed: false 
            });
            
            document.getElementById('morningDate_input').value = getTodayDate();
            document.getElementById('morningGrade').value = '';
            document.getElementById('morningClass').value = '';
            document.getElementById('morningClass').innerHTML = '<option value="">선택</option>';
            document.getElementById('morningName').value = '';
            document.getElementById('morningReasonOther').value = '';
            document.querySelectorAll('#morning .reason-btn').forEach(b => b.classList.remove('selected'));
            selectedMorningReason = '';
            
            save();
            renderMorning();
            alert('저장되었습니다!');
        }

        function confirmMorningCheck(id) {
            const m = morningCheck.find(x => x.id == id);
            if (m) { m.confirmed = true; save(); renderMorning(); }
        }

        updateAllDates();
    </script>
</body>
</html>
