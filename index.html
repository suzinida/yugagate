<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 생활지도 관리 시스템</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 180px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px 0;
            overflow-y: auto;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #666;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f9f9f9;
            color: #333;
        }

        .nav-item.active {
            background: #f0f7ff;
            border-left-color: #378ADD;
            color: #378ADD;
            font-weight: 600;
        }

        .main {
            padding: 32px;
            overflow-y: auto;
        }

        .header-date {
            display: inline-block;
            background: #378ADD;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 { font-size: 28px; margin-bottom: 24px; font-weight: 600; }
        h2 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }
        h3 { font-size: 16px; margin-bottom: 12px; font-weight: 600; }
        h4 { font-size: 14px; margin-bottom: 12px; font-weight: 600; margin-top: 16px; }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #378ADD;
            color: white;
            transition: all 0.2s;
        }

        button:hover { background: #2563c4; }
        button.secondary { background: #f0f0f0; color: #333; }
        button.secondary:hover { background: #e0e0e0; }

        .page { display: none; }
        .page.active { display: block; }

        .sync-status {
            padding: 12px;
            background: #eff6ff;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 12px;
            color: #1e40af;
        }

        .sync-status.success {
            background: #dcfce7;
            border-color: #10b981;
            color: #166534;
        }

        .sync-status.error {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .hamburger { display: block; }
            .sidebar {
                position: fixed;
                left: -200px;
                top: 0; bottom: 0;
                width: 200px;
                z-index: 999;
                transition: left 0.3s;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }
            .sidebar.active { left: 0; }
            .main { padding: 12px; }
            .card { padding: 12px; margin-bottom: 12px; }
            h1 { font-size: 20px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()">☰</button>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="nav-item active" onclick="switchPage('home')">🏠 홈</div>
            <div class="nav-item" onclick="switchPage('settings')">🔧 설정</div>
        </div>

        <div class="main">
            <!-- 홈 페이지 -->
            <div id="home" class="page active">
                <div class="header-date" id="todayDate"></div>
                <h1>📋 생활지도 관리</h1>

                <!-- 학생 조회 -->
                <div class="card">
                    <h2>📌 학생 조회</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>학년</label>
                            <select id="inputGrade" onchange="updateClassDropdown()">
                                <option value="">선택</option>
                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>반</label>
                            <select id="inputClass">
                                <option value="">선택</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="inputName" placeholder="이름 입력" list="studentNameList" onchange="selectStudent(this.value)">
                        <datalist id="studentNameList"></datalist>
                        <input type="hidden" id="inputNumber">
                    </div>

                    <button onclick="queryRecords()" style="width: 100%;">🔍 조회</button>
                </div>

                <!-- 조회 결과 -->
                <div id="queryResultContainer"></div>
            </div>

            <!-- 설정 페이지 -->
            <div id="settings" class="page">
                <div class="header-date"></div>
                <h1>🔧 설정</h1>
                
                <div class="card">
                    <h2 style="color: #3b82f6;">📡 학생명단 동기화</h2>
                    <p style="color: #666; margin-bottom: 16px; font-size: 13px;">
                        Google Sheets에서 학생명단을 동기화합니다.<br>
                        처음 사용 시 또는 학생명단 변경 후 눌러주세요.
                    </p>
                    <button type="button" onclick="loadStudentListFromSheets()" 
                        style="width: 100%; background: #3b82f6; color: white;">
                        🔄 학생명단 로드
                    </button>
                    <div id="syncStatus" class="sync-status" style="display: none; margin-top: 12px;"></div>
                </div>

                <div class="card">
                    <h2 style="color: #10b981;">✅ 로드된 학생명단</h2>
                    <div id="studentListPreview" style="max-height: 300px; overflow-y: auto; font-size: 12px;">
                        <p style="color: #999; text-align: center; padding: 20px;">로드 버튼을 눌러주세요</p>
                    </div>
                </div>

                <div class="card">
                    <h2 style="color: #666;">ℹ️ 정보</h2>
                    <p style="color: #666; font-size: 13px; line-height: 1.6;">
                        <strong>App Version:</strong> 3.0 (CSV Direct)<br>
                        <strong>Data Storage:</strong> Google Sheets<br>
                        <br>
                        📌 이 앱은 Google Sheets를 직접 읽습니다.<br>
                        새로고침하면 최신 데이터가 로드됩니다.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        // ========== 설정 ==========
        const SHEET_ID = '1FzZaqtdiTHpULtzAJSC-sLEkRVcYJWrNc1JVEe0jDyA';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        let studentList = [];

        // ========== 초기화 ==========
        window.addEventListener('load', () => {
            console.log('✅ 페이지 로드 완료');
            updateAllDates();
        });

        // ========== Google Sheets에서 CSV로 학생명단 로드 ==========
        async function loadStudentListFromSheets() {
            try {
                console.log('📡 Google Sheets에서 CSV 로드 중...');
                const statusEl = document.getElementById('syncStatus');
                statusEl.style.display = 'block';
                statusEl.className = 'sync-status';
                statusEl.innerHTML = '⏳ 로드 중...';

                const response = await fetch(CSV_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const csv = await response.text();
                console.log('✅ CSV 다운로드 완료');

                // Papa Parse로 CSV 파싱
                Papa.parse(csv, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const data = results.data;

                        if (data.length < 2) {
                            throw new Error('학생명단이 비어있습니다');
                        }

                        // Row 1은 헤더 스킵, Row 2부터 데이터
                        studentList = data.slice(1)
                            .filter(row => row[0] && row[1] && row[2] && row[3])
                            .map(row => ({
                                grade: parseInt(row[0]),
                                class: parseInt(row[1]),
                                number: parseInt(row[2]),
                                name: String(row[3]).trim()
                            }));

                        console.log(`✅ 학생명단 파싱 완료: ${studentList.length}명`);

                        // UI 업데이트
                        statusEl.className = 'sync-status success';
                        statusEl.innerHTML = `✅ ${studentList.length}명 로드 완료! (${new Date().toLocaleTimeString('ko-KR')})`;

                        showStudentListPreview();
                    },
                    error: function(error) {
                        throw error;
                    }
                });

            } catch (error) {
                console.error('❌ 로드 실패:', error);
                const statusEl = document.getElementById('syncStatus');
                statusEl.style.display = 'block';
                statusEl.className = 'sync-status error';
                statusEl.innerHTML = `❌ 로드 실패: ${error.message}`;
            }
        }

        // ========== 학생 필터링 ==========
        function getStudentsByClass(grade, cls) {
            return studentList
                .filter(s => s.grade == grade && s.class == cls)
                .sort((a, b) => a.number - b.number);
        }

        function getStudentNamesByClass(grade, cls) {
            return getStudentsByClass(grade, cls)
                .map(s => s.name);
        }

        // ========== 학반 드롭다운 업데이트 ==========
        function updateClassDropdown() {
            const grade = document.getElementById('inputGrade').value;
            const classSelect = document.getElementById('inputClass');
            classSelect.innerHTML = '<option value="">선택</option>';

            let maxClass = 0;
            if (grade === '1') maxClass = 11;
            else if (grade === '2') maxClass = 12;
            else if (grade === '3') maxClass = 11;

            for (let i = 1; i <= maxClass; i++) {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '반';
                classSelect.appendChild(opt);
            }
            
            classSelect.addEventListener('change', updateStudentNameList);
        }

        // ========== 학생명단 업데이트 (이름 자동완성) ==========
        function updateStudentNameList() {
            const grade = document.getElementById('inputGrade').value;
            const cls = document.getElementById('inputClass').value;
            const datalist = document.getElementById('studentNameList');
            
            datalist.innerHTML = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputNumber').value = '';
            
            if (grade && cls) {
                const names = getStudentNamesByClass(grade, cls);
                names.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    datalist.appendChild(option);
                });
            }
        }

        // ========== 학생 선택 (이름 선택 시 번호 자동 매칭) ==========
        function selectStudent(fullName) {
            const grade = parseInt(document.getElementById('inputGrade').value);
            const cls = parseInt(document.getElementById('inputClass').value);
            
            const students = getStudentsByClass(grade, cls);
            const selected = students.find(s => s.name === fullName);
            
            if (selected) {
                document.getElementById('inputNumber').value = selected.number;
            } else {
                document.getElementById('inputNumber').value = '';
            }
        }

        // ========== 조회 ==========
        function queryRecords() {
            const g = document.getElementById('inputGrade').value;
            const c = document.getElementById('inputClass').value;
            const n = document.getElementById('inputName').value;
            let num = document.getElementById('inputNumber').value;
            
            if (!g || !c || !n) {
                alert('학년, 반, 이름을 모두 입력해주세요!');
                return;
            }

            // 번호가 없으면 입력된 이름으로 자동 매칭
            if (!num) {
                const grade = parseInt(g);
                const cls = parseInt(c);
                const students = getStudentsByClass(grade, cls);
                const selected = students.find(s => s.name === n);
                
                if (selected) {
                    num = selected.number;
                    document.getElementById('inputNumber').value = num;
                } else {
                    alert('입력하신 이름이 학생명단에 없습니다.\n이름을 다시 확인해주세요.');
                    return;
                }
            }

            // 학생 확인
            const student = studentList.find(s => 
                s.grade == g && s.class == c && s.number == num && s.name === n
            );

            if (!student) {
                document.getElementById('queryResultContainer').innerHTML = `
                    <div class="card" style="background: #fee2e2; border-left: 4px solid #ef4444;">
                        <h3 style="color: #991b1b;">⚠️ 조회 결과</h3>
                        <p style="color: #c41c3b; font-weight: 600; padding: 16px 0;">
                            조회된 학생이 없습니다
                        </p>
                    </div>
                `;
                return;
            }

            // 학생이 있음 - 확인 메시지
            document.getElementById('queryResultContainer').innerHTML = `
                <div class="card" style="background: #f0f9ff; border-left: 4px solid #3b82f6;">
                    <h3>✅ ${g}학년 ${c}반 ${num}번 ${n}</h3>
                    <p style="color: #666; margin: 12px 0;">학생이 확인되었습니다.</p>
                    <p style="color: #378ADD; font-weight: 600;">
                        현재는 조회 기능만 지원합니다.<br>
                        저장 기능은 준비 중입니다.
                    </p>
                </div>
            `;
        }

        // ========== 페이지 전환 ==========
        function switchPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('sidebar').classList.remove('active');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // ========== 날짜 ==========
        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function updateAllDates() {
            const d = new Date(getTodayDate());
            const days = ['(일)', '(월)', '(화)', '(수)', '(목)', '(금)', '(토)'];
            const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}`;
            document.querySelectorAll('[id$="Date"]').forEach(el => el.textContent = dateStr);
        }

        // ========== 명단 미리보기 ==========
        function showStudentListPreview() {
            const preview = document.getElementById('studentListPreview');
            
            if (studentList.length === 0) {
                preview.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">명단이 없습니다.</p>';
                return;
            }
            
            let html = `<table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                <tr style="background: #f0f0f0; font-weight: 600;">
                    <td style="padding: 6px; border: 1px solid #ddd; width: 40px;">학년</td>
                    <td style="padding: 6px; border: 1px solid #ddd; width: 40px;">반</td>
                    <td style="padding: 6px; border: 1px solid #ddd; width: 40px;">번호</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">이름</td>
                </tr>`;
            
            studentList.slice(0, 50).forEach(student => {
                html += `<tr>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${student.grade}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${student.class}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${student.number}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${student.name}</td>
                </tr>`;
            });
            
            if (studentList.length > 50) {
                html += `<tr style="background: #f9f9f9;"><td colspan="4" style="padding: 8px; text-align: center; color: #999; font-size: 11px;">... 외 ${studentList.length - 50}명</td></tr>`;
            }
            
            html += '</table>';
            preview.innerHTML = html;
        }
    </script>
</body>
</html>
