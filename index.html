<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 생활지도 관리</title>

<!-- 앱처럼 쓰기 (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#378ADD">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생활지도">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f5f5f5;
    color: #333;
    line-height: 1.5;
}
.container { display: grid; grid-template-columns: 180px 1fr; min-height: 100vh; }
.sidebar { background: #fff; border-right: 1px solid #ddd; padding: 20px 0; }
.nav-item {
    padding: 12px 16px;
    cursor: pointer;
    color: #666;
    border-left: 3px solid transparent;
}
.nav-item:hover { background: #f9f9f9; color: #333; }
.nav-item.active { background: #f0f7ff; border-left-color: #378ADD; color: #378ADD; font-weight: 600; }
.hamburger {
    display: none;
    position: fixed; top: 10px; left: 10px; z-index: 1000;
    background: #fff; border: 1px solid #ddd; border-radius: 6px;
    font-size: 20px; padding: 4px 10px; cursor: pointer; color: #333;
}
.main { padding: 32px; }
.header-date {
    display: inline-block;
    background: #378ADD; color: #fff;
    padding: 8px 16px; border-radius: 6px;
    font-size: 14px; font-weight: 600; margin-bottom: 16px;
}
h1 { font-size: 26px; margin-bottom: 20px; font-weight: 600; }
h2 { font-size: 18px; margin-bottom: 14px; font-weight: 600; }
h3 { font-size: 16px; margin-bottom: 12px; font-weight: 600; }
h4 { font-size: 13px; margin: 18px 0 8px; font-weight: 600; color: #555; }
.card {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 20px; margin-bottom: 20px;
}
.card .note { color: #666; font-size: 13px; margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 600; }
input, select, textarea {
    width: 100%; padding: 10px;
    border: 1px solid #ddd; border-radius: 4px;
    font-size: 14px; font-family: inherit; background: #fff;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
textarea:disabled { background: #f3f3f3; color: #999; }
.memo-count { font-size: 12px; color: #888; text-align: right; margin-top: 4px; }
.memo-count.warn { color: #b45309; }
button {
    padding: 10px 16px; border: none; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: #378ADD; color: #fff;
}
button:hover { background: #2563c4; }
button:disabled { opacity: .55; cursor: not-allowed; }
button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
button.secondary { background: #f0f0f0; color: #333; }
button.secondary:hover { background: #e2e2e2; }
button.success { background: #10b981; }
button.success:hover { background: #059669; }
button.wide { width: 100%; }

/* 사유 · 조치 선택 */
.pick-btn {
    border: 3px solid transparent;
    padding: 11px 10px; width: 100%;
    font-size: 13px; font-weight: 600;
}
.pick-btn.on { border-color: currentColor; }
.pick-btn.on::after { content: ' ✓'; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.page { display: none; }
.page.active { display: block; }

.status {
    padding: 12px; border-radius: 6px; font-size: 13px;
    background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af;
}
.status.good { background: #dcfce7; border-color: #86efac; color: #166534; }
.status.warn { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
.status.bad { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }

.record {
    padding: 12px; margin-bottom: 8px;
    background: #fafafa; border-left: 4px solid #10b981;
}
.record.pending { border-left-color: #f59e0b; }
.record .top { font-weight: 600; color: #378ADD; font-size: 13px; }
.record .mid { margin: 3px 0; }
.record .bot { font-size: 12px; color: #666; }
.memo-text {
    margin-top: 6px; padding: 8px 10px;
    background: #fff; border: 1px dashed #d4d4d4; border-radius: 4px;
    font-size: 13px; color: #444; white-space: pre-wrap; word-break: break-word;
}
.syncing { font-size: 12px; color: #888; font-weight: 400; margin-left: 6px; }

.task {
    padding: 12px; border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.task:last-child { border-bottom: none; }
.task .who { font-weight: 600; }
.task .when { font-size: 12px; color: #888; margin-top: 3px; }
.task button { flex-shrink: 0; }
.empty { color: #888; text-align: center; padding: 24px 12px; font-size: 13px; }

.modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 100;
    align-items: center; justify-content: center; padding: 16px;
}
.modal.on { display: flex; }
.modal .box { background: #fff; border-radius: 8px; padding: 24px; width: 100%; max-width: 460px; }
.modal p { margin: 12px 0 20px; color: #444; white-space: pre-line; word-break: break-word; }
.modal .grid-2 { gap: 12px; }
.modal button { padding: 12px 16px; }

.toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: #111; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; font-weight: 600; z-index: 200; max-width: 90%; display: none;
}
.toast.on { display: block; }
.toast.bad { background: #b91c1c; }

table.list { width: 100%; border-collapse: collapse; font-size: 12px; }
table.list td { padding: 6px; border: 1px solid #e5e5e5; }
table.list tr.head td { background: #f2f2f2; font-weight: 600; }

@media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .hamburger { display: block; }
    .sidebar {
        position: fixed; left: -220px; top: 0; bottom: 0; width: 200px;
        z-index: 999; transition: left .25s; box-shadow: 2px 0 8px rgba(0,0,0,.15);
    }
    .sidebar.on { left: 0; }
    .main { padding: 56px 12px 24px; }
    .form-row, .grid-3 { grid-template-columns: 1fr; }
    .task { flex-direction: column; align-items: stretch; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<button class="hamburger" onclick="toggleSidebar()" aria-label="메뉴">☰</button>

<div class="container">
    <nav class="sidebar" id="sidebar">
        <div class="nav-item active" data-page="home">🏠 지도 입력</div>
        <div class="nav-item" data-page="review">✅ 미완료 과제</div>
        <div class="nav-item" data-page="settings">🔧 설정</div>
    </nav>

    <main class="main">
        <!-- 지도 입력 -->
        <section id="home" class="page active">
            <div class="header-date js-date"></div>
            <h1>생활지도 입력</h1>
            <div class="card">
                <div id="listStatus" class="status" style="margin-bottom:14px;">학생명단을 불러오는 중…</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="selGrade">학년</label>
                        <select id="selGrade" onchange="onGrade()"><option value="">선택</option></select>
                    </div>
                    <div class="form-group">
                        <label for="selClass">반</label>
                        <select id="selClass" onchange="onClass()"><option value="">선택</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="selStudent">학생</label>
                    <select id="selStudent" onchange="onStudent()">
                        <option value="">학년과 반을 먼저 고르세요</option>
                    </select>
                </div>
            </div>
            <div id="panel"></div>
            <div id="history"></div>
        </section>

        <!-- 미완료 과제 -->
        <section id="review" class="page">
            <div class="header-date js-date"></div>
            <h1>미완료 과제</h1>
            <div class="card">
                <p class="note">지정했지만 아직 끝내지 않은 과제입니다. 오래된 순으로 보여줍니다.</p>
                <button class="wide" onclick="loadTasks()">목록 새로 고치기</button>
            </div>
            <div id="tasks"><div class="card"><p class="empty">목록을 새로 고쳐 주세요.</p></div></div>
        </section>

        <!-- 설정 -->
        <section id="settings" class="page">
            <div class="header-date js-date"></div>
            <h1>설정</h1>
            <div class="card">
                <h2>서버 연결 확인</h2>
                <p class="note">저장이 안 될 때 여기부터 확인하세요. 버전이 2.1로 나오면 메모 기능까지 모두 쓸 수 있습니다.</p>
                <button class="success wide" onclick="ping()">연결 확인</button>
                <div id="pingStatus" class="status" style="display:none; margin-top:12px;"></div>
            </div>
            <div class="card">
                <h2>학생명단</h2>
                <p class="note">명단 시트를 고쳤다면 여기서 다시 불러오세요. 불러온 명단은 이 기기에 저장되어 다음부터 바로 뜹니다.</p>
                <button class="wide" id="reloadBtn" onclick="loadStudents(true)">학생명단 다시 불러오기</button>
                <div id="preview" style="max-height:320px; overflow-y:auto; margin-top:16px;">
                    <p class="empty">아직 명단이 없습니다.</p>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal" id="modal">
    <div class="box">
        <h3 id="modalTitle">확인</h3>
        <p id="modalText"></p>
        <div class="grid-2">
            <button class="secondary" onclick="closeModal()">취소</button>
            <button id="modalOk" onclick="runModal()">확인</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 설정 — 웹앱 주소가 바뀌면 이 줄만 고치면 됩니다.
// ============================================================
const API = 'https://script.google.com/macros/s/AKfycbwAdxMYN5S9s9LxkyxpLfNHEf3hYyq667RuURtXLKliCV73C70s4tKeLW0u3oS3cvqM/exec';

// 이 화면과 함께 쓸 수 있는 서버 버전. 2.1부터 메모를 저장합니다.
const SUPPORTED_VERSIONS = ['2.0', '2.1'];
const MEMO_VERSION = '2.1';
const MEMO_MAX = 500;

const STUDENT_CACHE_KEY = 'guidance.students.v1';
const REFRESH_AFTER_MS = 5 * 60 * 1000; // 5분 넘게 쉬었다가 돌아오면 명단을 다시 확인합니다.

const REASONS = [
    { key: '지각', bg: '#fef3c7', fg: '#92400e' },
    { key: '복장', bg: '#fce7f3', fg: '#831843' },
    { key: '화장', bg: '#f3e8ff', fg: '#581c87' },
    { key: '기타', bg: '#ccfbf1', fg: '#134e4a' }
];
const TASKS = [
    { key: 'work',       name: '빡지', icon: '📝', bg: '#e0e7ff', fg: '#4338ca' },
    { key: 'clean',      name: '청소', icon: '✨', bg: '#cffafe', fg: '#0c4a6e' },
    { key: 'inspection', name: '검사', icon: '🔍', bg: '#dbeafe', fg: '#0c2d6b' }
];
const TASK_NAME = { work: '빡지', clean: '청소', inspection: '검사' };

// ============================================================
// 상태
// ============================================================
let students = [];
let student = null;
let reasons = new Set();
let tasks = new Set();
let taskList = [];
let modalAction = null;
let serverVersion = null;       // 서버가 마지막으로 알려준 버전
let saving = false;             // 저장 버튼 연타로 같은 기록이 두 번 들어가는 것을 막습니다.
let studentsLoading = null;     // 명단 요청이 겹치지 않게 합니다.
let lastSync = 0;
let hiddenAt = 0;
const historyCache = new Map(); // 학생별 지도내역. 다시 고르면 바로 보여주고 뒤에서 새로 확인합니다.
const completing = new Set();

// ============================================================
// 서버 통신
// Content-Type 은 반드시 text/plain 이어야 합니다.
// application/json 으로 보내면 브라우저가 사전 요청(OPTIONS)을 보내는데
// Apps Script 웹앱은 이를 처리하지 못해 요청이 실패합니다.
//
// 조회 요청은 실패하면 자동으로 두 번 더 시도합니다.
// 저장은 같은 기록이 두 번 들어갈 수 있어 자동으로 다시 보내지 않습니다.
// ============================================================
const RETRY_ACTIONS = new Set(['ping', 'getStudents', 'getRecords', 'getUncompletedTasks', 'complete']);

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function fail(message, retryable, kind) {
    const e = new Error(message);
    e.retryable = retryable;
    e.kind = kind || 'server';
    return e;
}

async function call(payload) {
    const canRetry = RETRY_ACTIONS.has(payload.action);
    const tries = canRetry ? 3 : 1;
    // Apps Script는 한동안 안 쓰다가 처음 부르면 몇 초 걸립니다. 넉넉히 기다립니다.
    const timeout = canRetry ? 20000 : 30000;
    let lastErr;
    for (let i = 0; i < tries; i++) {
        if (i > 0) await sleep(i === 1 ? 800 : 2000);
        try {
            return await callOnce(payload, timeout);
        } catch (e) {
            lastErr = e;
            if (!e.retryable) break;
        }
    }
    if (payload.action === 'save' && lastErr.retryable) {
        throw fail('저장됐는지 확인하지 못했습니다. 아래 지도내역에서 방금 기록이 있는지 확인한 뒤, 없으면 다시 저장하세요.', false, lastErr.kind);
    }
    throw lastErr;
}

async function callOnce(payload, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    let text;
    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow',
            signal: ctrl.signal
        });
        text = await res.text();
    } catch (e) {
        if (e.name === 'AbortError') {
            throw fail('서버 응답이 ' + (timeoutMs / 1000) + '초 넘게 없습니다. 잠시 후 다시 시도하세요.', true, 'timeout');
        }
        if (!navigator.onLine) throw fail('인터넷에 연결되어 있지 않습니다.', true, 'offline');
        throw fail('서버에 연결하지 못했습니다. 인터넷 연결과 웹앱 주소를 확인하세요.', true, 'network');
    } finally {
        clearTimeout(timer);
    }

    let json;
    try {
        json = JSON.parse(text);
    } catch (e) {
        if (/accounts\.google\.com|ServiceLogin/i.test(text)) {
            throw fail('서버가 구글 로그인 화면을 보냈습니다. 웹앱을 "모든 사용자" 액세스로 배포했는지 확인하세요.', false, 'login');
        }
        // 구글 서버가 가끔 JSON 대신 일시 오류 화면을 보냅니다. 다시 시도하면 대부분 됩니다.
        throw fail('서버가 일시적인 오류 화면을 보냈습니다. 잠시 후 다시 시도하세요.', true, 'badresponse');
    }

    if (SUPPORTED_VERSIONS.includes(json.version)) {
        serverVersion = json.version;
        updateMemoAvailability();
    }
    if (!json.success) throw fail(json.message || '요청을 처리하지 못했습니다.', false);

    // 예전 스크립트는 어떤 요청이든 "저장"으로 처리하고 목록 대신 엉뚱한 응답을 돌려줍니다.
    // 그 상태를 조용히 넘기지 않고 여기서 잡아냅니다.
    if (!SUPPORTED_VERSIONS.includes(json.version)) {
        throw fail('예전 스크립트가 배포돼 있습니다. 배포 관리에서 버전을 "새 버전"으로 다시 배포하세요.', false, 'version');
    }
    return json;
}

// 목록을 기대하는 요청인데 배열이 아니면 잘못된 응답입니다.
function asList(data) {
    if (!Array.isArray(data)) {
        throw fail('서버가 목록 대신 다른 응답을 보냈습니다. 배포된 스크립트 버전을 확인하세요.', false);
    }
    return data;
}

async function ping() {
    show('pingStatus', '', '확인 중…');
    try {
        const r = await call({ action: 'ping' });
        const today = r.data && r.data.today ? ' · 오늘 ' + r.data.today : '';
        if (r.version === MEMO_VERSION) {
            show('pingStatus', 'good', '연결 정상입니다. 서버 버전 ' + r.version + today);
        } else {
            show('pingStatus', 'warn', '연결은 정상입니다(서버 버전 ' + r.version + '). 메모를 저장하려면 새 Code.gs를 "새 버전"으로 배포하세요.' + today);
        }
    } catch (e) {
        show('pingStatus', 'bad', e.message);
    }
}

function show(id, kind, text) {
    const el = document.getElementById(id);
    el.style.display = 'block';
    el.className = 'status' + (kind ? ' ' + kind : '');
    el.textContent = text;
    return el;
}

// ============================================================
// 학생명단
// 이 기기에 저장해 둔 명단을 먼저 보여주고, 서버 명단은 뒤에서 확인합니다.
// ============================================================
function readCachedStudents() {
    try {
        const saved = JSON.parse(localStorage.getItem(STUDENT_CACHE_KEY) || 'null');
        return saved && Array.isArray(saved.list) ? saved.list : null;
    } catch (e) {
        return null;
    }
}

function writeCachedStudents(list) {
    try {
        localStorage.setItem(STUDENT_CACHE_KEY, JSON.stringify({ list, savedAt: Date.now() }));
    } catch (e) { /* 저장 공간이 없어도 앱은 그대로 작동합니다. */ }
}

function loadStudents(manual) {
    if (studentsLoading) return studentsLoading;
    studentsLoading = fetchStudents(manual).finally(() => { studentsLoading = null; });
    return studentsLoading;
}

async function fetchStudents(manual) {
    const hadList = students.length > 0;
    const btn = document.getElementById('reloadBtn');
    if (manual) { btn.disabled = true; btn.textContent = '불러오는 중…'; }
    if (!hadList) show('listStatus', '', '학생명단을 불러오는 중…');
    else if (manual) show('listStatus', '', '학생명단을 새로 불러오는 중…');

    try {
        const r = await call({ action: 'getStudents' });
        const list = asList(r.data);
        const changed = JSON.stringify(list) !== JSON.stringify(students);
        students = list;
        writeCachedStudents(list);
        lastSync = Date.now();

        if (list.length === 0) {
            show('listStatus', 'bad', '학생명단이 비어 있습니다. 명단 시트를 확인해 주세요.');
            applyStudents();
            return;
        }
        show('listStatus', 'good', '학생 ' + list.length + '명 준비됨');
        if (changed) applyStudents();
        if (manual) toast('학생명단을 새로 불러왔습니다.');
    } catch (e) {
        if (hadList) {
            show('listStatus', 'warn', '이 기기에 저장된 명단(' + students.length + '명)으로 작동 중입니다. 최신 명단 확인 실패: ' + e.message);
        } else {
            show('listStatus', 'bad', e.message + ' 설정 탭에서 "학생명단 다시 불러오기"를 눌러 보세요.');
        }
        if (manual) toast(e.message, true);
    } finally {
        if (manual) { btn.disabled = false; btn.textContent = '학생명단 다시 불러오기'; }
    }
}

function $(id) { return document.getElementById(id); }
function hasOption(sel, value) { return [...sel.options].some(o => o.value === value); }

// 명단이 바뀌어도 지금 고른 학년·반·학생은 그대로 둡니다.
function applyStudents() {
    const g = $('selGrade').value, c = $('selClass').value, n = $('selStudent').value;
    fillGrades();
    renderPreview();
    if (g && hasOption($('selGrade'), g)) {
        $('selGrade').value = g;
        fillClasses();
        if (c && hasOption($('selClass'), c)) {
            $('selClass').value = c;
            fillStudents();
            if (n && hasOption($('selStudent'), n)) {
                $('selStudent').value = n;
                student = findSelected() || student;
                return;
            }
        }
    }
    clearPanel();
}

function fillGrades() {
    const list = [...new Set(students.map(s => s.grade))].sort((a, b) => a - b);
    $('selGrade').innerHTML = '<option value="">선택</option>' +
        list.map(g => `<option value="${g}">${g}학년</option>`).join('');
    $('selClass').innerHTML = '<option value="">선택</option>';
    $('selStudent').innerHTML = '<option value="">학년과 반을 먼저 고르세요</option>';
}

function fillClasses() {
    const grade = +$('selGrade').value;
    const list = [...new Set(students.filter(s => s.grade === grade).map(s => s.class))]
        .sort((a, b) => a - b);
    $('selClass').innerHTML = '<option value="">선택</option>' +
        list.map(c => `<option value="${c}">${c}반</option>`).join('');
    $('selStudent').innerHTML = '<option value="">학년과 반을 먼저 고르세요</option>';
}

function fillStudents() {
    const grade = +$('selGrade').value;
    const cls = +$('selClass').value;
    const sel = $('selStudent');
    if (!grade || !cls) {
        sel.innerHTML = '<option value="">학년과 반을 먼저 고르세요</option>';
        return;
    }
    const list = students.filter(s => s.grade === grade && s.class === cls)
        .sort((a, b) => a.number - b.number);
    // 번호를 값으로 쓰므로 이름이 같은 학생도 구분됩니다.
    sel.innerHTML = '<option value="">선택</option>' +
        list.map(s => `<option value="${s.number}">${s.number}번 ${esc(s.name)}</option>`).join('');
}

function onGrade() { fillClasses(); clearPanel(); }
function onClass() { fillStudents(); clearPanel(); }

function findSelected() {
    const grade = +$('selGrade').value;
    const cls = +$('selClass').value;
    const number = +$('selStudent').value;
    if (!number) return null;
    return students.find(s => s.grade === grade && s.class === cls && s.number === number) || null;
}

// 학생을 고르는 즉시 입력 카드와 지도내역이 함께 뜹니다.
function onStudent() {
    student = findSelected();
    if (!student) { clearPanel(); return; }
    reasons = new Set();
    tasks = new Set();
    renderPanel();
    loadHistory();
}

function clearPanel() {
    student = null;
    $('panel').innerHTML = '';
    $('history').innerHTML = '';
}

// ============================================================
// 입력 카드
// ============================================================
function renderPanel() {
    const reasonBtns = REASONS.map(r =>
        `<button type="button" class="pick-btn" id="r-${r.key}"
            style="background:${r.bg}; color:${r.fg}"
            onclick="pickReason('${r.key}')">${r.key}</button>`).join('');

    const taskBtns = TASKS.map(t =>
        `<button type="button" class="pick-btn" id="t-${t.key}"
            style="background:${t.bg}; color:${t.fg}"
            onclick="pickTask('${t.key}')">${t.icon} ${t.name}</button>`).join('');

    $('panel').innerHTML = `
        <div class="card" style="background:#f0f9ff; border-left:4px solid #3b82f6;">
            <h3>${student.grade}학년 ${student.class}반 ${student.number}번 ${esc(student.name)}</h3>

            <h4>지도 사유 (여러 개 고를 수 있습니다)</h4>
            <div class="grid-2">${reasonBtns}</div>
            <input type="text" id="reasonEtc" placeholder="기타 사유를 입력하세요"
                style="display:none; margin-top:8px;">

            <h4>조치 (여러 개 고를 수 있습니다)</h4>
            <div class="grid-3">${taskBtns}</div>
            <p style="font-size:12px; color:#666; margin-top:8px;">
                조치를 고르지 않으면 사유만 기록합니다.
            </p>

            <h4><label for="memo">메모 (선택)</label></h4>
            <textarea id="memo" rows="3" maxlength="${MEMO_MAX}"
                placeholder="상황, 학생 반응, 담임에게 전할 내용 등을 적어 두세요"
                oninput="onMemoInput()"></textarea>
            <div class="memo-count" id="memoCount">0 / ${MEMO_MAX}</div>

            <button class="wide" id="saveBtn" style="margin-top:14px;" onclick="askSave()">기록 저장</button>
        </div>`;
    updateMemoAvailability();
}

function onMemoInput() {
    const el = $('memo');
    const count = $('memoCount');
    if (!el || !count) return;
    count.textContent = el.value.length + ' / ' + MEMO_MAX;
    count.classList.toggle('warn', el.value.length > MEMO_MAX * 0.9);
}

// 서버가 2.0이면 메모가 저장되지 않으므로 입력칸을 잠급니다.
function updateMemoAvailability() {
    const el = $('memo');
    if (!el) return;
    const blocked = serverVersion !== null && serverVersion !== MEMO_VERSION;
    el.disabled = blocked;
    if (blocked) {
        el.placeholder = '메모를 쓰려면 서버(Code.gs)를 2.1로 업데이트해야 합니다';
    } else {
        el.placeholder = '상황, 학생 반응, 담임에게 전할 내용 등을 적어 두세요';
    }
}

function pickReason(key) {
    reasons.has(key) ? reasons.delete(key) : reasons.add(key);
    $('r-' + key).classList.toggle('on', reasons.has(key));
    const etc = $('reasonEtc');
    etc.style.display = reasons.has('기타') ? 'block' : 'none';
    if (reasons.has('기타')) etc.focus();
}

function pickTask(key) {
    tasks.has(key) ? tasks.delete(key) : tasks.add(key);
    $('t-' + key).classList.toggle('on', tasks.has(key));
}

// ============================================================
// 저장 — 지도 한 건마다 새 행 하나
// ============================================================
function askSave() {
    if (!student || saving) return;
    if (reasons.size === 0) return toast('지도 사유를 고르세요.', true);

    // 고른 순서가 아니라 늘 같은 순서로 정리해서 저장합니다.
    const picked = REASONS.map(r => r.key).filter(k => reasons.has(k) && k !== '기타');
    if (reasons.has('기타')) {
        const etc = $('reasonEtc').value.trim();
        if (!etc) return toast('기타 사유를 입력하세요.', true);
        picked.push(etc);
    }
    const reasonText = picked.join(', ');

    const memoEl = $('memo');
    const memo = memoEl && !memoEl.disabled ? memoEl.value.trim().slice(0, MEMO_MAX) : '';

    const taskKeys = TASKS.map(t => t.key).filter(k => tasks.has(k));
    const taskText = taskKeys.length
        ? taskKeys.map(k => TASK_NAME[k]).join(', ') + ' 지정'
        : '조치 없이 기록만';

    const payload = {
        action: 'save',
        date: today(),
        grade: student.grade,
        class: student.class,
        number: student.number,
        name: student.name,
        reason: reasonText,
        tasks: taskKeys,
        memo: memo
    };

    const memoLine = memo
        ? '\n메모: ' + (memo.length > 60 ? memo.slice(0, 60) + '…' : memo)
        : '';

    openModal('기록 저장',
        `${student.name} 학생\n사유: ${reasonText}\n${taskText}${memoLine}`,
        '저장',
        () => save(payload));
}

function setSaving(on) {
    saving = on;
    const btn = $('saveBtn');
    if (!btn) return;
    btn.disabled = on;
    btn.textContent = on ? '저장 중…' : '기록 저장';
}

async function save(payload) {
    const target = student;
    setSaving(true);
    try {
        const r = await call(payload);
        if (payload.memo && r.version !== MEMO_VERSION) {
            toast('기록은 저장했지만 메모는 저장되지 않았습니다. 서버를 2.1로 업데이트하세요.', true);
        } else {
            toast('저장했습니다.');
        }

        // 방금 저장한 기록을 지도내역 맨 위에 바로 보여줍니다.
        const key = studentKey(target);
        const rec = { date: payload.date, reason: payload.reason, memo: payload.memo };
        TASKS.forEach(t => {
            rec['assigned' + cap(t.key)] = payload.tasks.includes(t.key) ? 'Y' : '';
            rec['completed' + cap(t.key)] = '';
        });
        historyCache.set(key, [rec, ...(historyCache.get(key) || [])]);

        if (student && studentKey(student) === key) {
            reasons = new Set();
            tasks = new Set();
            renderPanel(); // 같은 학생을 이어서 지도할 수 있게 카드는 남겨 둡니다.
            loadHistory();
        }
    } catch (e) {
        toast(e.message, true); // 실패하면 고른 사유와 메모가 그대로 남아 있습니다.
    } finally {
        setSaving(false);
    }
}

// ============================================================
// 지도내역 — 전체 기록, 최신순
// ============================================================
function studentKey(s) {
    return [s.grade, s.class, s.number, s.name].join('|');
}

async function loadHistory() {
    const target = student;
    const key = studentKey(target);
    const box = $('history');
    const cached = historyCache.get(key);

    if (cached) renderHistory(cached, true);
    else box.innerHTML = '<div class="card"><p class="empty">지도내역을 불러오는 중…</p></div>';

    try {
        const r = await call({
            action: 'getRecords',
            grade: target.grade,
            class: target.class,
            number: target.number,
            name: target.name
        });
        const list = asList(r.data);
        historyCache.set(key, list);
        // 그사이 다른 학생을 골랐다면 화면을 덮어쓰지 않습니다.
        if (student && studentKey(student) === key) renderHistory(list, false);
    } catch (e) {
        if (!student || studentKey(student) !== key) return;
        if (cached) {
            renderHistory(historyCache.get(key), false, '최신 내역 확인 실패: ' + e.message);
        } else {
            box.innerHTML = `<div class="card"><p class="empty" style="color:#991b1b;">${esc(e.message)}</p>
                <button class="secondary wide" onclick="loadHistory()">다시 불러오기</button></div>`;
        }
    }
}

function renderHistory(records, syncing, warning) {
    const box = $('history');
    const syncNote = syncing ? '<span class="syncing">최신 내역 확인 중…</span>' : '';
    const warnNote = warning ? `<p class="status warn" style="margin-bottom:10px;">${esc(warning)}</p>` : '';

    if (records.length === 0) {
        box.innerHTML = `<div class="card"><h3>지도내역${syncNote}</h3>${warnNote}<p class="empty">아직 기록이 없습니다.</p></div>`;
        return;
    }

    const items = records.map(r => {
        const marks = [];
        let pending = false;
        TASKS.forEach(t => {
            const a = r['assigned' + cap(t.key)];
            const c = r['completed' + cap(t.key)];
            if (a !== 'Y') return;
            const done = c === 'Y';
            if (!done) pending = true;
            marks.push(t.name + (done ? ' 완료' : ' 미완료'));
        });
        const memo = r.memo ? `<div class="memo-text">📝 ${esc(r.memo)}</div>` : '';
        return `<div class="record${pending ? ' pending' : ''}">
            <div class="top">${esc(r.date)}</div>
            <div class="mid">${esc(r.reason)}</div>
            <div class="bot">${marks.length ? esc(marks.join(' · ')) : '기록만'}</div>
            ${memo}
        </div>`;
    }).join('');

    box.innerHTML = `<div class="card"><h3>지도내역 ${records.length}건${syncNote}</h3>${warnNote}${items}</div>`;
}

function cap(key) {
    // work → Work, clean → Clean, inspection → Inspection
    return key.charAt(0).toUpperCase() + key.slice(1);
}

// ============================================================
// 미완료 과제
// ============================================================
async function loadTasks() {
    const box = $('tasks');
    if (taskList.length === 0) box.innerHTML = '<div class="card"><p class="empty">불러오는 중…</p></div>';
    try {
        const r = await call({ action: 'getUncompletedTasks' });
        taskList = asList(r.data);
        renderTasks();
    } catch (e) {
        box.innerHTML = `<div class="card"><p class="empty" style="color:#991b1b;">${esc(e.message)}</p></div>`;
    }
}

function taskId(t) {
    return [t.row, t.type].join('-');
}

function renderTasks() {
    const box = $('tasks');
    if (taskList.length === 0) {
        box.innerHTML = '<div class="card" style="background:#dcfce7; border-color:#86efac;">' +
            '<p class="empty" style="color:#166534;">밀린 과제가 없습니다.</p></div>';
        return;
    }

    let html = '';
    TASKS.forEach(t => {
        const items = taskList
            .map((task, i) => ({ task, i }))
            .filter(o => o.task.type === t.key);
        if (items.length === 0) return;

        html += `<div class="card" style="border-left:4px solid ${t.fg};">
            <h3 style="color:${t.fg}">${t.icon} ${t.name} 미완료 ${items.length}건</h3>` +
            items.map(o => {
                const s = o.task;
                const busy = completing.has(taskId(s));
                const memo = s.memo ? `<div class="memo-text">📝 ${esc(s.memo)}</div>` : '';
                return `<div class="task">
                    <div>
                        <div class="who">${s.grade}학년 ${s.class}반 ${s.number}번 ${esc(s.name)}</div>
                        <div class="when">${esc(s.date)} · ${esc(s.reason)}</div>
                        ${memo}
                    </div>
                    <button class="success" ${busy ? 'disabled' : ''} onclick="askComplete(${o.i})">${busy ? '처리 중…' : '완료 처리'}</button>
                </div>`;
            }).join('') + '</div>';
    });
    box.innerHTML = html;
}

function askComplete(i) {
    const t = taskList[i];
    if (!t || completing.has(taskId(t))) return;
    openModal('완료 처리',
        `${t.name} 학생\n${t.date} · ${t.reason}\n${TASK_NAME[t.type]}를 완료로 표시합니다.`,
        '완료 처리',
        () => complete(t));
}

async function complete(t) {
    const id = taskId(t);
    completing.add(id);
    renderTasks();
    try {
        // row 를 함께 보내 목록에서 누른 바로 그 기록만 완료 처리합니다.
        await call({
            action: 'complete',
            row: t.row,
            type: t.type,
            grade: t.grade,
            class: t.class,
            number: t.number,
            name: t.name
        });
        toast(TASK_NAME[t.type] + ' 완료로 표시했습니다.');
        taskList = taskList.filter(x => taskId(x) !== id);
        historyCache.delete(studentKey(t)); // 그 학생 지도내역은 다음에 새로 받아옵니다.
    } catch (e) {
        toast(e.message, true);
    } finally {
        completing.delete(id);
        renderTasks();
    }
    loadTasks();
}

// ============================================================
// 모달 · 토스트
// ============================================================
function openModal(title, text, okLabel, action) {
    $('modalTitle').textContent = title;
    $('modalText').textContent = text;
    $('modalOk').textContent = okLabel;
    modalAction = action;
    $('modal').classList.add('on');
}

function closeModal() {
    $('modal').classList.remove('on');
    modalAction = null;
}

function runModal() {
    const action = modalAction;
    closeModal();
    if (action) action();
}

let toastTimer = null;
function toast(text, bad) {
    const el = $('toast');
    el.textContent = text;
    el.className = 'toast on' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, bad ? 5000 : 3000);
}

// ============================================================
// 유틸
// ============================================================
function today() {
    const d = new Date();
    return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
}

function esc(v) {
    return String(v ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderPreview() {
    const box = $('preview');
    if (students.length === 0) {
        box.innerHTML = '<p class="empty">아직 명단이 없습니다.</p>';
        return;
    }
    const rows = students.slice(0, 60).map(s =>
        `<tr><td style="text-align:center">${s.grade}</td>
          <td style="text-align:center">${s.class}</td>
          <td style="text-align:center">${s.number}</td>
          <td>${esc(s.name)}</td></tr>`).join('');
    const more = students.length > 60
        ? `<tr><td colspan="4" style="text-align:center; color:#888">외 ${students.length - 60}명</td></tr>`
        : '';
    box.innerHTML = `<table class="list">
        <tr class="head"><td>학년</td><td>반</td><td>번호</td><td>이름</td></tr>
        ${rows}${more}</table>`;
}

function updateDates() {
    const d = new Date();
    const days = ['(일)','(월)','(화)','(수)','(목)','(금)','(토)'];
    const text = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()];
    document.querySelectorAll('.js-date').forEach(el => el.textContent = text);
}

// ============================================================
// 화면 전환 · 시작
// ============================================================
function switchPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(name).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if (el) el.classList.add('active');
    $('sidebar').classList.remove('on');
    window.scrollTo(0, 0);
    if (name === 'review') loadTasks();
}

function toggleSidebar() {
    $('sidebar').classList.toggle('on');
}

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => switchPage(item.dataset.page, item));
});

updateDates();

// 저장해 둔 명단이 있으면 서버를 기다리지 않고 바로 씁니다.
const cachedStudents = readCachedStudents();
if (cachedStudents && cachedStudents.length) {
    students = cachedStudents;
    applyStudents();
    show('listStatus', '', '학생 ' + students.length + '명 준비됨 · 최신 명단 확인 중…');
}
// 페이지를 여는 즉시 서버를 깨워 둡니다. 첫 요청이 가장 느리기 때문입니다.
loadStudents();

// 앱을 한동안 안 쓰다 다시 열면 날짜를 고치고, 명단을 새로 확인하며 서버를 깨웁니다.
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        hiddenAt = Date.now();
        return;
    }
    updateDates();
    if (hiddenAt && Date.now() - hiddenAt > REFRESH_AFTER_MS) loadStudents();
});

window.addEventListener('online', () => {
    if (Date.now() - lastSync > REFRESH_AFTER_MS) loadStudents();
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
</script>

</html>
